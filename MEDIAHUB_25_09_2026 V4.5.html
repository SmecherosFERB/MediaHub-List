    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer"></noscript>
    <style>
        :root {
            --bg-color: #000000; --text-color: #ffffff; --card-bg: #141414; --border-color: rgba(255,255,255,0.25);

            --app-font-size: 14px; --t-ha: center; --t-va: middle; --t-wr: normal;

        }

            --input-bg:#f3f4f6; --text-muted:#4b5563; --table-hover:rgba(0,0,0,0.02); --control-bg:rgba(0,0,0,0.03);
            --poster-bg:#eaeaea; --active-tab-bg:rgba(0,0,0,0.03); --active-tab-text:#111827;

        body { background: var(--bg-color); color: var(--text-color); margin: 0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; transition: all .3s; }
        
        /* CUSTOM UTILITY COMPONENTS */
        .btn { font-weight:var(--btn-fw); text-transform:uppercase; transition:var(--btn-tr); display:flex; align-items:center; justify-content:center; gap:.5rem; border-radius:var(--r-md); padding:.75rem; font-size:.75rem; cursor:pointer; box-shadow:var(--sh-1); border:none; }
        /* primary / secondary buttons: same shape and height everywhere (modals, toolbar); the round header buttons keep their own size below */
        .btn-p, .btn-s { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; min-height:var(--h-md); padding:0 var(--btn-px); border-radius:var(--r-md); font-size:var(--btn-fs); font-weight:var(--btn-fw); text-transform:uppercase; cursor:pointer; transition:var(--btn-tr); box-sizing:border-box; }

        .btn-p { background:var(--theme-accent); color:#fff; } .btn-p:hover { filter:brightness(1.1); box-shadow:0 6px 18px -8px color-mix(in srgb, var(--theme-accent) 75%, transparent); }
        .btn-s { background:transparent; color:var(--text-color); border:1px solid color-mix(in srgb, var(--theme-accent) 20%, transparent); } .btn-s:hover { background:var(--theme-accent); border-color:var(--theme-accent); color:#fff; }
        .btn-i { background:transparent; border:1px solid var(--border-color); color:var(--theme-accent); padding:.5rem; border-radius:var(--r-md); font-size:.5rem; flex-direction:column; gap:.25rem; } .btn-i:hover { background:var(--hov); }
        .inp { background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); width:100%; border-radius:.75rem; padding:.875rem; font-size:.75rem; font-weight:700; outline:none; transition:all .3s; box-sizing:border-box; }

        .lbl { font-size:.625rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin:0 0 .25rem .25rem; display:block; }
        .h-sub { font-size:.6875rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin-bottom:.75rem; }
        input[type="color"] { -webkit-appearance:none; appearance:none; width:44px; height:44px; padding:0; border:1px solid var(--border-color); border-radius:.75rem; background:var(--input-bg); cursor:pointer; }

        /* The Tailwind utilities are pre-compiled into the <style id="tw-generated"> block above, but

        .hidden { display:none !important; }

        /* Safety net: if the icon font fails to load (offline, blocked CDN, ad blocker) an

        i.fas, i.fab { display:inline-block; min-width:1em; min-height:1em; font-style:normal; }

        /* ===== SETTINGS PANEL: pill-shaped controls ===== */
        .set-sec { margin-bottom:1.75rem; }
        .set-hd { display:flex; align-items:center; gap:.5rem; margin-bottom:.25rem; }
        .set-hd i { color:var(--theme-accent); font-size:.8125rem; width:1.125rem; text-align:center; flex-shrink:0; }
        .set-ttl { font-size:.75rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; color:var(--text-color); }
        .set-hint { font-size:.6875rem; font-weight:500; color:var(--text-muted); line-height:1.45; margin:0 0 .75rem 1.625rem; }
        .set-badge { display:inline-flex; align-items:center; gap:.375rem; margin-top:.625rem; padding:.3125rem .75rem; border-radius:999px; font-size:.5625rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; line-height:1.4; background:color-mix(in srgb, var(--theme-accent) 14%, transparent); color:var(--theme-accent); }
        .set-card { padding:1.125rem; border-radius:1.5rem; border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); background:var(--input-bg); }

        /* segmented control (one choice out of N) */
        .seg { display:flex; gap:.25rem; padding:.25rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); }
        .seg-btn { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:.375rem; padding:.625rem .5rem; border:none; border-radius:var(--r-pill); background:transparent; color:var(--text-muted); font-family:inherit; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; cursor:pointer; transition:var(--btn-tr); }
        .seg-btn i { font-size:.75rem; flex-shrink:0; }
        .seg-btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .seg-btn:hover { color:var(--text-color); background:var(--hov); }
        .seg-btn.on { background:var(--theme-accent); color:#fff; box-shadow:0 1px 6px color-mix(in srgb, var(--theme-accent) 35%, transparent); }
        .seg-btn.on:hover { background:var(--theme-accent); filter:brightness(1.05); }
        .seg-btn:active { transform:scale(.95); }

        /* switch row (an explicit on/off setting with its own explanation) */
        .sw-row { display:flex; align-items:center; gap:.75rem; width:100%; box-sizing:border-box; padding:.75rem .875rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); cursor:pointer; font-family:inherit; color:var(--text-color); text-align:left; transition:border-color .2s, background .2s, transform .15s; }
        .sw-row + .sw-row { margin-top:.5rem; }
        .sw-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 50%, transparent); background:color-mix(in srgb, var(--theme-accent) 6%, var(--input-bg)); }
        .sw-row:active { transform:scale(.99); }
        .sw-ico { flex:0 0 auto; width:1.875rem; height:1.875rem; border-radius:999px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--theme-accent) 12%, transparent); color:var(--theme-accent); font-size:.75rem; transition:background .2s; }

        .sw-sub { display:block; font-size:.625rem; font-weight:500; color:var(--text-muted); line-height:1.35; margin-top:.0625rem; }
        .sw-state { flex:0 0 auto; min-width:2.25rem; text-align:right; font-size:.5625rem; font-weight:900; text-transform:uppercase; color:var(--text-muted); letter-spacing:.02em; }
        .sw-row.on .sw-state { color:var(--theme-accent); }
        .sw-tgl { flex:0 0 auto; width:2.375rem; height:1.375rem; border-radius:999px; background:color-mix(in srgb, var(--text-muted) 50%, transparent); position:relative; transition:background .25s; }

        /* toggle pills (visible categories / visible columns) */

        .pill { display:inline-flex; align-items:center; gap:.375rem; padding:.4375rem .8125rem; border-radius:999px; font-family:inherit; font-size:.625rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; cursor:pointer; border:1px solid transparent; transition:background .2s, color .2s, border-color .2s, transform .15s; }

        .act-row + .act-row { margin-top:.5rem; }

        .act-row:active { transform:scale(.99); }
        .act-go { flex:0 0 auto; width:1.75rem; height:1.75rem; border-radius:999px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--theme-accent) 12%, transparent); color:var(--theme-accent); font-size:.625rem; transition:background .2s, color .2s, transform .2s; }

        .ac-hex { font-family:var(--font-mono, monospace); font-size:.6875rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; }
        .dp-ctl input[type="color"] { width:34px; height:34px; border-radius:999px; }
        .dp-ctl input[type="color"]::-webkit-color-swatch { border-radius:999px; }

        /* drawers: a pill bar with a summary and a chevron that opens the options underneath */
        .drw + .drw { margin-top:.5rem; }
        .drw-sum { flex:0 0 auto; font-size:.5625rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; color:var(--theme-accent); padding:.25rem .5rem; border-radius:999px; background:color-mix(in srgb, var(--theme-accent) 12%, transparent); white-space:nowrap; }
        .drw-hd .drw-chev i { transition:transform .25s; }

        .drw.open .drw-chev i { transform:rotate(180deg); }
        .drw-body { display:none; padding:.5rem 0 .25rem .75rem; margin:0 0 .25rem 1.4rem; border-left:2px solid color-mix(in srgb, var(--theme-accent) 30%, transparent); }
        .drw.open .drw-body { display:block; }
        /* rows inside an open drawer are one size down from the drawer bar, so the nesting reads at a glance */
        .drw-body .stp-row, .drw-body .sw-row, .drw-body .act-row { padding:.4375rem .625rem; gap:.5rem; }
        .drw-body .stp-row + .stp-row, .drw-body .sw-row + .sw-row, .drw-body .dp-list > * { margin-top:.375rem; }
        .drw-body .dp-list > :first-child { margin-top:0; }
        .drw-body .sw-ico { width:1.5rem; height:1.5rem; font-size:.625rem; }
        .drw-body .sw-name { font-size:.625rem; }
        .drw-body .sw-sub { font-size:.5625rem; }
        .drw-body .sw-state, .drw-body .stp-unit { font-size:.5rem; }
        .drw-body .sw-tgl { width:2rem; height:1.125rem; }
        .drw-body .sw-tgl::after { width:.875rem; height:.875rem; }
        .drw-body .sw-row.on .sw-tgl::after { transform:translateX(.875rem); }
        .drw-body .stp-btn { width:1.25rem; height:1.25rem; font-size:.5625rem; }
        .drw-body .stp-val { width:2.2rem; font-size:.6875rem; }
        .drw-body .seg-sm .seg-btn { padding:.3125rem .5rem; font-size:.5rem; }
        .drw-body .cr-row { padding:.3125rem .4375rem; }

        /* storage usage meter */
        .meter { height:.4375rem; border-radius:999px; background:color-mix(in srgb, var(--text-muted) 28%, transparent); overflow:hidden; }
        .meter-fill { display:block; height:100%; border-radius:999px; background:var(--theme-accent); transition:width .45s ease; }
        .meter-fill.warn { background:#f0a020; }
        .meter-fill.full { background:#e0342c; }
        .meter-cap { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; margin-bottom:.4375rem; font-size:.625rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; }
        .meter-cap b { color:var(--theme-accent); font-weight:900; }
        .meter-note { font-size:.625rem; font-weight:500; color:var(--text-muted); line-height:1.4; margin-top:.4375rem; }

        /* danger card */
        .set-card.danger { border-color:color-mix(in srgb, var(--theme-accent) 38%, transparent); background:color-mix(in srgb, var(--theme-accent) 8%, transparent); }
        .btn-danger { display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%; box-sizing:border-box; padding:.75rem; border-radius:var(--r-pill); font-family:inherit; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; background:transparent; color:var(--theme-accent); border:1px solid color-mix(in srgb, var(--theme-accent) 45%, transparent); transition:var(--btn-tr); }

        .btn-pill { border-radius:var(--r-pill); padding:.9375rem; font-size:.8125rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em; }

        /* SPECIFIC APP ELEMENTS */
        .main-wrapper { width:100%; max-width:1280px; margin:0 auto; padding:24px; box-sizing:border-box; overflow-x:hidden; }
        @media (max-width: 768px) { .main-wrapper { padding:12px; } }
        
        .loading-bar { position:sticky; top:0; width:100%; height:5px; background:#111; z-index:1000; display:none; }
        .progress { height:100%; background:var(--theme-accent); transition:width .3s; box-shadow:0 0 10px var(--theme-accent); }
        .theme-card { background:var(--card-bg); border:1px solid var(--border-color); transition:all .3s; }
        .theme-text { color:var(--text-color); }
        #b-rows { font-size:var(--app-font-size); } 
        .name-cell { font-size:calc(var(--app-font-size) + 6px)!important; font-weight:900; min-width:250px; }
        #nav button { font-size:calc(var(--app-font-size) - 2px); flex-shrink: 0; padding:9.6px 12.8px; }
        @media (min-width:768px) { #nav button { padding:12.8px 19.2px; } }
        #h-row th { font-size:var(--hdr-fs, calc(var(--app-font-size) - 3px)); padding:8px; }
        .poster-container { width:44px; height:64px; flex-shrink:0; overflow:hidden; position:relative; border:1px solid var(--border-color); border-radius:5px; display:flex; align-items:center; justify-content:center; background:var(--poster-bg); }
        /* fill (cover) by default so every poster is the same size; body.po-fit switches to contain */
        .poster-img { width:100%; height:100%; object-fit:cover; object-position:center; cursor:zoom-in; position:relative; z-index:10; border-radius:3px; display:block; }
        /* note tooltip + note preview text */
        #note-tip { position:fixed; z-index:2600; max-width:340px; padding:10px 13px; border-radius:var(--r-lg); background:var(--card-bg); color:var(--text-color); border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); box-shadow:var(--sh-2); font-size:12px; font-weight:600; line-height:1.45; white-space:pre-wrap; overflow-wrap:anywhere; text-align:left; pointer-events:none; opacity:0; visibility:hidden; transform:translateY(3px); transition:opacity var(--t-fast), transform var(--t-fast), visibility 0s linear var(--t-fast); }
        #note-tip.show { opacity:1; visibility:visible; transform:none; transition:opacity var(--t-fast), transform var(--t-fast); }
        body:not(.is-mobile) .note-tx { display:inline-block; max-width:28ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; vertical-align:bottom; }
        #zoom-preview { position:fixed; z-index:9999; pointer-events:none; border-radius:6px; box-shadow:10px 0 30px rgba(0,0,0,.9); outline:2px solid var(--theme-accent); object-fit:cover; display:none; }
        td,th { border:0; text-align:var(--t-ha); vertical-align:var(--t-va); white-space:var(--t-wr); padding:9px 10px; transition:background-color .2s; } tr:hover { background-color:var(--table-hover)!important; }
        .no-cell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
        .no-val { font-weight:900; }
        .no-arrow { background:transparent; border:none; color:var(--theme-accent); cursor:pointer; padding:0; margin:0; width:24px; height:13.2px; font-size:9.6px; line-height:13.2px; opacity:0; transition:opacity .15s ease; }
        tr:hover .no-arrow:not(:disabled) { opacity:.75; }
        .no-arrow:hover:not(:disabled) { opacity:1; }
        .no-arrow:disabled { visibility:hidden; cursor:default; }
        .rw-cell { display:flex; align-items:center; justify-content:center; gap:4px; }
        .rw-val { font-weight:900; min-width:14px; text-align:center; }
        /* ---- Depth Customization look settings (classes set by applyLook) ---- */
        body.fw-normal #b-rows, body.fw-normal #b-rows .tp, body.fw-normal #b-rows .grade-pill, body.fw-normal #b-rows .rw-val, body.fw-normal #b-rows .no-val, body.fw-normal #h-row th { font-weight:500 !important; }
        body.fw-normal #b-rows .name-cell { font-weight:600 !important; }
        body.fw-bold #b-rows, body.fw-bold #b-rows .tp, body.fw-bold #b-rows .grade-pill, body.fw-bold #b-rows .rw-val, body.fw-bold #b-rows .no-val, body.fw-bold #h-row th { font-weight:700 !important; }

        /* ---- clean report ---- */

        /* ---- clean report: total + Fix all, drawers with Auto, rows with old -> new ---- */
        .cl-top { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; padding:.75rem .875rem; margin-bottom:.75rem; border-radius:var(--r-lg); background:color-mix(in srgb, var(--theme-accent) 8%, transparent); border:1px solid color-mix(in srgb, var(--theme-accent) 22%, transparent); }
        .cl-tot { flex:1 1 auto; display:flex; align-items:baseline; gap:.5rem; min-width:0; }

        .cl-top .cl-fixall { width:auto; margin:0; padding:.5rem 1rem; }
        .cl-prog { font-size:.6875rem; font-weight:900; text-transform:uppercase; color:var(--text-color); display:inline-flex; align-items:center; gap:.4rem; }
        .cl-stop { padding:.4375rem .875rem; border-radius:var(--r-pill); border:1px solid #e0342c; background:transparent; color:#e0342c; font-family:inherit; font-size:.625rem; font-weight:900; cursor:pointer; transition:var(--btn-tr); }

        .drw-sum.zero { color:var(--text-muted); background:color-mix(in srgb, var(--text-muted) 14%, transparent); }
        .cl-row.has-diff { flex-wrap:wrap; border-radius:1rem; row-gap:.25rem; }
        .cl-diff { order:5; flex:1 1 100%; min-width:0; padding:0 .25rem; font-size:.625rem; font-weight:700; color:var(--text-muted); overflow-wrap:anywhere; white-space:pre-wrap; }
        .cl-diff s { opacity:.7; } .cl-diff b { color:var(--text-color); } .cl-diff i { font-size:.5rem; margin:0 .2rem; color:var(--theme-accent); } .cl-diff em { font-style:normal; color:#f0a020; margin-left:.3rem; }
        .cl-tag { flex-shrink:0; font-style:normal; font-size:.5625rem; font-weight:900; text-transform:uppercase; color:#f0a020; }

        .cl-repl { display:inline-flex; align-items:center; gap:.4rem; margin:0 0 .5rem; padding:.375rem .875rem; border-radius:var(--r-pill); border:1px dashed color-mix(in srgb, var(--theme-accent) 45%, transparent); background:transparent; color:var(--theme-accent); font-family:inherit; font-size:.5625rem; font-weight:900; text-transform:uppercase; cursor:pointer; transition:var(--btn-tr); }
        .cl-repl:hover { background:var(--hov); } .cl-repl.arm { background:#e0342c; border-color:#e0342c; color:#fff; } .cl-repl:disabled { opacity:.4; cursor:not-allowed; }
        .cl-secs .drw-body { padding-right:.25rem; }
        .cl-secs .drw-body .cl-note { margin-left:0; }
        /* ---- colour rule builder ---- */
        .cr-row { display:flex; align-items:center; gap:.375rem; padding:.4375rem .5rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 15%, transparent); margin-bottom:.375rem; }
        .cr-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 40%, transparent); }
        .cr-dot { flex-shrink:0; width:.875rem; height:.875rem; border-radius:999px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }
        .cr-row select, .cr-row input { font-family:inherit; font-weight:700; color:var(--text-color); background:transparent; border:none; outline:none; border-radius:999px; padding:.25rem .4375rem; font-size:.6875rem; }
        .cr-row select:focus, .cr-row input:focus { background:color-mix(in srgb, var(--theme-accent) 12%, transparent); }
        .cr-col { flex:0 0 5.5rem; text-transform:uppercase; }
        .cr-val { flex:1 1 auto; min-width:3rem; }

        .cr-size { flex:0 0 2.75rem; text-align:center; }
        .cr-color { -webkit-appearance:none; appearance:none; flex:0 0 1.75rem; width:1.75rem; min-width:1.75rem; height:1.75rem; padding:0; border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); border-radius:999px; overflow:hidden; cursor:pointer; background:transparent; }

        /* phone: a rule is wider than the dialog, so colour / style / size move to a second line */

        body.is-mobile .cr-val { flex:1 1 4rem; }

        #cr-raw-wrap .cr-raw-body { display:none; margin-top:.5rem; }
        #cr-raw-wrap.open .cr-raw-body { display:block; }
        #cr-raw-btn { display:inline-flex; align-items:center; gap:.375rem; background:transparent; border:none; color:var(--text-muted); font-family:inherit; font-size:.5625rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; padding:.25rem 0; }
        #cr-raw-btn:hover { color:var(--theme-accent); }

        /* ---- pill table ---- */
        .tp { display:inline-flex; align-items:center; gap:4px; border-radius:999px; font-size:calc(var(--app-font-size) - 4px); font-weight:900; text-transform:uppercase; letter-spacing:.02em; padding:3px 9px; white-space:nowrap; line-height:1.35; }
        .tp-gen { background:color-mix(in srgb, var(--text-muted) 18%, transparent); color:var(--text-muted); }
        body.light-theme .tp-gen { background:rgba(0,0,0,.06); color:#4b5563; }
        .tp-rate { background:color-mix(in srgb, #f0a020 20%, transparent); color:#f0a020; }
        .tp-ep { background:color-mix(in srgb, #12b981 20%, transparent); color:#2fd6a0; }
        body.light-theme .tp-ep { color:#0e8a60; }
        .tp-raw { background:color-mix(in srgb, var(--text-muted) 14%, transparent); color:var(--text-muted); font-weight:700; text-transform:none; letter-spacing:0; }
        .tp-more { background:transparent; color:var(--text-muted); border:1px solid color-mix(in srgb, var(--theme-accent) 28%, transparent); cursor:pointer; font-family:inherit; }
        .tp-more:hover { color:var(--theme-accent); border-color:var(--theme-accent); }
        .cell-pills { touch-action:manipulation; display:flex; flex-wrap:wrap; white-space:nowrap; gap:4px; align-items:center; justify-content:var(--t-ha,center); cursor:text; min-height:24px; padding:2px; border-radius:10px; }
        .cell-pills:hover { background:color-mix(in srgb, var(--theme-accent) 6%, transparent); }
        .cell-pills:not(.all) .xtra { display:none; }
        .cell-pills.lp-arm { animation:lpFill .48s linear forwards; }
        @keyframes lpFill { from { box-shadow:inset 0 0 0 0 color-mix(in srgb, var(--theme-accent) 0%, transparent); } to { box-shadow:inset 0 0 0 2px var(--theme-accent); background:color-mix(in srgb, var(--theme-accent) 12%, transparent); } }
        @media (hover:none) { .cell-pills { cursor:default; } .cell-pills:hover { background:transparent; } }

        .cell-pills:empty::before, .cell-pills.is-empty::before { content:"\f304"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--text-muted); opacity:.35; font-size:calc(var(--app-font-size) - 3px); }
        .pill-edit { width:100%; outline:none; border-radius:10px; padding:3px 8px; background:color-mix(in srgb, var(--theme-accent) 10%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--theme-accent) 45%, transparent); font-weight:700; }

        /* IMDB now lives inside the genres cell */
        .tp-imdb { background:#f5c518; color:#000 !important; text-decoration:none; padding-right:4px; }
        .tp-imdb:hover { filter:brightness(1.08); }
        .tp-imdb .imdb-pen { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:999px; background:rgba(0,0,0,.18); font-size:8px; }
        .tp-imdb .imdb-pen:hover { background:rgba(0,0,0,.38); }
        .tp-addlink { background:transparent; color:var(--text-muted); border:1px dashed color-mix(in srgb, var(--theme-accent) 35%, transparent); cursor:pointer; font-family:inherit; }
        .tp-addlink:hover { color:var(--theme-accent); border-color:var(--theme-accent); }

        /* grade as a badge */
        .grade-pill { display:inline-flex !important; align-items:center; justify-content:center; min-width:3.2ch; padding:3px 10px; border-radius:999px; font-weight:900 !important; background:color-mix(in srgb, var(--gp, var(--text-muted)) 20%, transparent); color:var(--gp, var(--text-color)) !important; }
        .grade-next.grade-pill { --gp:#12b981; } .grade-drop.grade-pill { --gp:#e0342c; }

        /* lighter grid: rows separate, columns do not */
        #tbl-box table { border-collapse:separate; border-spacing:0; }
        #tbl-box tbody td { border-bottom:1px solid color-mix(in srgb, var(--theme-accent) 9%, transparent); }
        #tbl-box tbody tr:hover td { background:color-mix(in srgb, var(--theme-accent) 5%, transparent); }
        #tbl-box thead th { border-bottom:1px solid color-mix(in srgb, var(--theme-accent) 22%, transparent); }

        /* popup menu for row / table actions */
        .pop-menu { position:fixed; z-index:2500; min-width:190px; padding:6px; border-radius:16px; background:var(--card-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); box-shadow:0 18px 40px rgba(0,0,0,.5); }
        .pop-item { display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box; padding:9px 12px; border:none; border-radius:var(--r-pill); background:transparent; color:var(--text-color); font-family:inherit; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; text-align:left; transition:var(--btn-tr); }
        .pop-item i { width:14px; text-align:center; color:var(--theme-accent); font-size:11px; }
        .pop-item:hover { background:var(--hov); }
        .pop-item.danger, .pop-item.danger i { color:#e0342c; }
        .pop-item.danger:hover { background:rgba(224,52,44,.14); }
        .pop-item:disabled { opacity:.4; cursor:not-allowed; }
        .pop-sep { height:1px; margin:5px 8px; background:color-mix(in srgb, var(--theme-accent) 18%, transparent); }
        .menu-btn { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:var(--r-pill); border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); background:transparent; color:var(--theme-accent); cursor:pointer; font-size:12px; transition:var(--btn-tr); }

        #m-fab { display: none; }

        /* =====================================================================
           PHONE UI (body.is-mobile): sticky top block, chips, poster cards, bigger sheets.
           Everything is scoped under .is-mobile, so the PC layout is untouched. The Tailwind
           utilities at the top live in @layer, so plain rules written here always win over them.
           ===================================================================== */
        #m-tools { display:none; }
        body.is-mobile { --m-gut:max(12px, env(safe-area-inset-left), env(safe-area-inset-right)); --m-gap:8px; --m-pw:min(calc(var(--po-w, 44px) * 1.7), 34vw); --m-ph:calc(var(--m-pw) * 1.5); min-height:100vh; min-height:100dvh; }

        /* One comparer for every text sort: localeCompare(b,'en',{numeric:true}) built a new one per comparison

        const TXT_CMP = new Intl.Collator('en', {numeric:true}).compare;

        function chkImg(u){ if(!u||!u.startsWith('http'))return Promise.resolve('empty'); return new Promise(res=>{const i=new Image(); let done=false; const fin=v=>{if(done)return; done=true; clearTimeout(to); res(v);}; const to=setTimeout(()=>fin('dead'),8000); i.onload=()=>fin('ok'); i.onerror=()=>fin('dead'); i.src=u;}); }

        /* Fetch a fresh poster from TMDB rather than just blanking the dead URL.

        async function tmdbPosterFor(row){

        /* ===================== CLEAN REPORT =====================
           Every check returns issues { row, edits:[[col,value]], del, man, label, from, to }.

           committed as ONE undo step ({t:'B'}), so Ctrl+Z reverts a whole Auto / Fix all at once. */
        let CLN={}, CLN_ITEMS=[], CLN_DEAD=new Map(), CLN_BUSY=null, CLN_STOP=false, CLN_ARM=null;
        const CL_SECS=[
            {id:'dup',   icon:'clone',                name:'clDup',    sub:'hClDup'},
            {id:'imdb',  icon:'link-slash',           name:'clNoImdb', sub:'hClImdb', tmdb:true},
            {id:'poster',icon:'image',                name:'clDead',   sub:'hClPo',   tmdb:true},
            {id:'grade', icon:'wand-magic-sparkles',  name:'clGrade',  sub:'hClGrade'},
            {id:'gbad',  icon:'triangle-exclamation', name:'clGBad',   sub:'hClGBad'},
            {id:'len',   icon:'ruler-horizontal',     name:'clLen',    sub:'hClLen'},
            {id:'gen',   icon:'tags',                 name:'clGen',    sub:'hClGen'},
            {id:'txt',   icon:'broom',                name:'clTxt',    sub:'hClTxt'}
        ];
        const clName=r=>String(r[COL.NAME]??'').trim()||t('clNoTitle');
        /* grades: any mark between digits becomes a dot (9,10 -> 9.10, 9..10 -> 9.10); next/drop in capitals */
        const GRADE_OK=v=>/^(NEXT|DROP)$/.test(v) || (/^\d+(\.\d+)?$/.test(v) && +v>=1 && +v<=10);
        function clGradeSep(v){
            const s=String(v??'').trim(), u=s.toUpperCase();
            if(u==='DROPPED') return 'DROP';
            if(/^(NEXT|DROP)$/.test(u)) return u!==s?u:null;
            if(s.includes('/')) return null;
            const n=s.replace(/(\d)\s*[.,;:·][\s.,;:·]*(?=\d)/g,'$1.');
            return n!==s?n:null;
        }
        /* not 1-10 / NEXT / DROP: fixed only when the intent is clear (10/10, 9.5., 8+), otherwise left to the user */
        function clGradeBad(v){
            const s=String(v??'').trim(); if(!s || GRADE_OK(s)) return null;
            let m=s.match(/^(\d+(?:\.\d+)?)\s*\/\s*10$/), to=null;
            if(m) to=m[1]; else { m=s.match(/^(\d+(?:\.\d+)?)[^\d]*$/); if(m) to=m[1]; }
            return { to: to!==null && GRADE_OK(to) ? to : null };
        }
        /* Length: the format the TMDB sync writes, rating first: "R- 4 Seasons | 89 Episodes", "148 min" */
        function clLen(v){
            const raw=String(v??'').trim(); if(!raw || /^n\/?a$/i.test(raw)) return null;
            const {rate,rest}=splitRate(raw), o=parseOwned(rest);
            const left=rest.replace(/\d+\s*[-\s]?seasons?/ig,'').replace(/\d+\s*(?:episodes?|eps?\b)/ig,'').replace(/\d+\s*min(?:utes?|s)?\.?/ig,'').replace(/[\s|·,;:\-–—/()]+/g,'');
            let len='';
            if(o.seasons!=null && o.episodes!=null) len=`${o.seasons} Seasons | ${o.episodes} Episodes`;
            else if(o.seasons!=null) len=`${o.seasons} Seasons`;
            else if(o.episodes!=null) len=`${o.episodes} Episodes`;
            else if(o.runtime!=null) len=`${o.runtime} min`;
            if(!len || left) return { to:null };
            const to=[...rate, len].join(' ');

        /* Genres: one spelling, no repeats, ratings (R+, PG-13) untouched */
        const GEN_ALIAS={'science fiction':'Sci-Fi','science-fiction':'Sci-Fi','scifi':'Sci-Fi','sci fi':'Sci-Fi','sci-fi':'Sci-Fi','sci-fi & fantasy':'Sci-Fi, Fantasy','action & adventure':'Action, Adventure','war & politics':'War, Politics'};
        const GEN_SMALL=new Set(['of','and','the','in','a','an','for','to','with','or']);
        const capW=w=>w.split('-').map(x=>x?x[0].toUpperCase()+x.slice(1):x).join('-');
        function genWord(w,i){
            if(!/\p{L}/u.test(w)) return w;
            if(w===w.toLowerCase()) return (i>0 && GEN_SMALL.has(w)) ? w : capW(w);
            if(w===w.toUpperCase() && w.replace(/[^\p{L}]/gu,'').length>=4) return capW(w.toLowerCase());

        function clGen(v){
            const raw=String(v??''); if(!raw.trim()) return null;

            raw.split(/[,/|;]/).forEach(p=>{
                p=p.replace(/\s+/g,' ').trim(); if(!p) return;
                const al=GEN_ALIAS[p.toLowerCase()];
                (al?al.split(', '):[p]).forEach(g=>{
                    if(!RATE_RX.test(g)) g=g.split(' ').map(genWord).join(' ');

        /* text: trim, no double spaces (notes keep their line breaks), Rewatches as a number, empty rows */
        function clTxt(r){
            const edits=[];

                if(c===COL.NOTE) n=v.split('\n').map(l=>l.replace(/[ \t]{2,}/g,' ').trimEnd()).join('\n').trim();

        }
        const clBlankRow=r=>r.every((v,c)=>c===numCol() || c===COL.REWATCH || !String(v??'').trim());
        /* spaces that matter (at the ends, doubled) are shown as · so a whitespace fix is visible */
        const clVis=v=>String(v??'').replace(/^ +| +$/g,m=>'·'.repeat(m.length)).replace(/ {2,}/g,m=>'·'.repeat(m.length))||'∅';

        function clScan(){
            const S={}; CL_SECS.forEach(s=>S[s.id]=[]);
            const groups=new Map();
            STATE.data.forEach(r=>{
                const nm=String(r[COL.NAME]??'').trim(), label=clName(r);

                }
                if(COL.EXTRA!==undefined){ const l=clLen(r[COL.EXTRA]); if(l) S.len.push({row:r, label, edits:l.to!==null?[[COL.EXTRA,l.to]]:[], man:l.to===null, ...clDiff(r[COL.EXTRA], l.to??r[COL.EXTRA])}); }
                const gc=COL.THEME??COL.GENRE; if(gc!==undefined){ const g=clGen(r[gc]); if(g) S.gen.push({row:r, label, edits:[[gc,g.to]], ...clDiff(r[gc],g.to)}); }

        /* apply into an accumulator (rows change at once), then clCommit() records one undo step */

        /* TMDB work: 4 at a time, progress in the top card, STOP between requests */

        function clProg(){ const p=$('cl-prog'); if(p&&CLN_BUSY) p.textContent=`${CLN_BUSY.label} ${CLN_BUSY.done}/${CLN_BUSY.total}`; }
        const clJob=(it,kind)=>kind==='imdb'?{row:it.row, col:COL.IMDB, kind, fn:tmdbImdbFor}:{row:it.row, col:COL.POSTER, kind, fn:tmdbPosterFor};
        function clTmdbDone(res, acc){ res.forEach(r=>{ if(r.kind==='poster') CLN_DEAD.delete(r.row); }); return clApply(res, acc); }
        const clNeedKey=()=>{ if(STATE.tmdbKey) return true; sTst(t('mAM'),'error'); return false; };

        /* Look up the IMDB id on TMDB by title (film or series, guessed from the tab like the sync does) */
        async function tmdbImdbFor(row){
            if(!STATE.tmdbKey) return null;
            const name=String(row[COL.NAME]||'').trim(); if(!name) return null;
            const lng=STATE.lang==='RO'?'ro-RO':'en-US', isMovie=STATE.sheet.toUpperCase().includes('MOVIE');

        /* ---- report UI: total + Fix all on top, one drawer per check with its Auto button and the list ---- */
        function clItemHTML(it, sec){

                +(CLN_BUSY?`<span id="cl-prog" class="cl-prog">${ic('spinner','fa-spin')} ${esc(CLN_BUSY.label)} ${CLN_BUSY.done}/${CLN_BUSY.total}</span><button type="button" class="cl-stop" data-act="clStop">${esc(t('clStop'))}</button>`
                           :`<button type="button" class="cl-fixall" data-act="clAll"${total-man>0?'':' disabled'}>${ic('wand-magic-sparkles')} <span>${esc(t('clAll'))}</span></button>`)+`</div>`;

                }

                    +`<button type="button" class="drw-hd act-row" aria-expanded="false" data-act="clDrw" data-d="cl-${s.id}"><span class="sw-ico">${ic(s.icon)}</span><span class="sw-txt"><span class="sw-name">${esc(t(s.name))}</span><span class="sw-sub">${esc(t(s.sub))}</span></span><span class="drw-sum${n?'':' zero'}">${n}</span><span class="act-go drw-chev">${ic('chevron-down')}</span></button>`

        const clLocalIds=['grade','gbad','len','gen','txt'];
        async function clAuto(id){
            if(CLN_BUSY) return;

        async function clAll(){
            if(CLN_BUSY) return;

        async function syR(ref, isB=false, f=false){
            if(!STATE.hdrs?.length)return false;
            const r=Array.isArray(ref)?ref:STATE.data[ref]; if(!r)return false;
            const pI=COL.POSTER, iI=COL.IMDB, tI=COL.THEME??COL.GENRE, eI=COL.EXTRA, n=r[COL.NAME]||'', cI=r[iI]||'';
            if(isB&&!f&&r[pI]?.startsWith('http')&&r[eI]?.trim())return false;
            if(!STATE.tmdbKey){ sTst(t("mAM"),"error"); oMod('stg'); return false; }
            const lng=STATE.lang==='RO'?'ro-RO':'en-US';
            /* If the row already has an IMDB link, that id tells us for certain whether this is a
               film or a series - far more reliable than guessing from the tab name. */
            let iM=STATE.sheet.toUpperCase().includes('MOVIE');
            const knownId=extractImdbId(cI);
            if(knownId){
                const fd=await radarFetch(tmdbUrl(`find/${knownId}`,{external_source:'imdb_id'}), f);
                if(fd?.movie_results?.length) iM=true; else if(fd?.tv_results?.length) iM=false;
            }
            const u=tmdbUrl(`search/${iM?'movie':'tv'}`,{query:n, language:lng});
            try{
                const rs=await fetch(u); if(!rs.ok){ if(!isB) sTst(`TMDB Err: ${rs.status}`,"error"); return false; }
                const d=await rs.json();
                if(!d.results||d.results.length===0){ if(!isB) sTst(`Fail: ${n}`,"warning"); return false; }
                const applyPick=async(picked)=>{
                    const du=tmdbUrl(`${iM?'movie':'tv'}/${picked.id}`,{language:lng, append_to_response:'external_ids'});
                    /* tmdbGet retries on 429 and returns null for any non-OK answer. The old bare fetch().json() treated a TMDB error body as data and wrote "0 Seasons | 0 Episodes" into the row. */
                    const dt=await tmdbGet(du, 3, f); /* forced sync = fresh data */
                    if(!dt||dt.id==null){ if(!isB) sTst(t('mF'),'error'); return false; }
                    if(pI!==undefined&&(!r[pI]||f))r[pI]=dt.poster_path?`https://image.tmdb.org/t/p/w500${dt.poster_path}`:'';
                    if(tI!==undefined&&(!r[tI]||f))r[tI]=dt.genres?dt.genres.flatMap(g=>g.name.split(/\s*&\s*/)).join(', '):'';
                    if(iI!==undefined&&!cI.trim()&&dt.external_ids?.imdb_id)r[iI]=`https://www.imdb.com/title/${dt.external_ids.imdb_id}`;
                    if(eI!==undefined&&(!r[eI]||f)){ const ex=iM?(dt.runtime?`${dt.runtime} min`:''):((dt.number_of_seasons||dt.number_of_episodes)?`${dt.number_of_seasons||0} Seasons | ${dt.number_of_episodes||0} Episodes`:''); if(ex) r[eI]=ex; } /* never write a made-up "0 Seasons" */
                    if(!isB)cmtSt(`${t("mSy")}${dt.title||dt.name}`); else upLib(STATE.sheet, STATE.hdrs, STATE.data);
                    return true;
                };
                if(isB||d.results.length===1){ return await applyPick(d.results[0]); }
                pickTmdbResult(d.results, applyPick); return false;
            }catch(e){ if(!isB) sTst(t('mF'),'error'); return false; }
        }

        /* tolerant comparison: Sheets can hand back numbers where we sent strings */
        function cloudMatches(remote, local){
            if(!Array.isArray(remote)||!Array.isArray(local)) return false;
            /* Sheets does not keep trailing blank rows, so they never count as a difference */
            const trim=t=>{ const o=[...t]; while(o.length && (o[o.length-1]||[]).every(c=>String(c??'').trim()==='')) o.pop(); return o; };
            remote=trim(remote); local=trim(local);
            if(remote.length!==local.length) return false;
            for(let i=0;i<local.length;i++){
                const a=remote[i]||[], b=local[i]||[];
                for(let j=0;j<b.length;j++){ if(String(a[j]??'').trim()!==String(b[j]??'').trim()) return false; }
            }
            return true;
        }

        /* ============================ RADAR ============================
           Scans the current category against TMDB and reports what changed since you
           last watched. Compared with the old version it:
             - reads how many seasons/episodes YOU have from the EXTRA column and reports
               the gap, instead of only describing TMDB's latest season
             - no longer requires "Returning Series", so a finished show that dropped a
               final season you never added is still reported
             - spends 2 requests per title instead of 3 (aired counts come from
               last_episode_to_air rather than a full season fetch)
             - caches every response, retries on HTTP 429 and surfaces real errors
             - can expand a card to pull the full episode list on demand
        */
        function extractImdbId(v){ const m=String(v||'').match(/tt\d{6,9}/); return m?m[0]:null; }

        const RDR_CACHE=new Map();
        let RDR_ABORT=null, RDR_SCANNING=false, RDR_STATS={done:0,total:0,errors:0,limited:0};
        const sleep=ms=>new Promise(r=>setTimeout(r,ms));

        /* Cached GET with backoff. TMDB answers 429 with a Retry-After header when you go
           over its rate limit; the old code treated that as "nothing new" and moved on. */
        /* Responses are kept for 30 minutes. Errors are never kept, so a later try really asks TMDB again;
           fresh=true (a forced row sync) skips the cache but refreshes it. */
        const TMDB_TTL=30*60*1000;
        const cacheSet=(url,v)=>RDR_CACHE.set(url,{t:Date.now(), v});
        async function tmdbGet(url, tries=3, fresh=false){
            const hit=RDR_CACHE.get(url);
            if(!fresh && hit && Date.now()-hit.t<TMDB_TTL) return hit.v;
            for(let i=0;i<tries;i++){
                if(RDR_ABORT?.signal?.aborted) return null;
                try{
                    const r=await fetch(url, RDR_ABORT?{signal:RDR_ABORT.signal}:undefined);
                    if(r.status===429){
                        RDR_STATS.limited++;
                        const wait=(parseInt(r.headers.get('retry-after'),10)||1)*1000;
                        await sleep(Math.min(wait, 8000)); continue;
                    }
                    if(r.status===404){ cacheSet(url,null); return null; }
                    if(!r.ok){ RDR_STATS.errors++; return null; }
                    const j=await r.json(); cacheSet(url,j); return j;
                }catch(e){
                    if(e&&e.name==='AbortError') return null;
                    if(i===tries-1){ RDR_STATS.errors++; return null; }
                    await sleep(400*(i+1));
                }
            }
            RDR_STATS.errors++; return null;
        }
        async function radarFetch(url, fresh=false){ return tmdbGet(url,2,fresh); }

        /* What the user already has, read straight out of the EXTRA column.
           Handles "3 Seasons | 26 Episodes", "R+ 4-Seasons 89 EP", "112 min", "N/A". */
        function parseOwned(extra){
            const s=String(extra||'');
            const se=s.match(/(\d+)\s*[-\s]?seasons?/i);
            const ep=s.match(/(\d+)\s*(?:episodes?|eps?\b)/i);
            const mn=s.match(/(\d+)\s*min/i);
            return { seasons:se?parseInt(se[1],10):null, episodes:ep?parseInt(ep[1],10):null, runtime:mn?parseInt(mn[1],10):null };
        }
        /* the LOCAL calendar day: toISOString() is UTC, which made "today" read as yesterday between 00:00 and 03:00 in Romania */
        const todayISO=()=>dStamp();
        function daysUntil(d){ if(!d) return null; const ms=new Date(d+'T00:00:00')-new Date(todayISO()+'T00:00:00'); return Math.round(ms/86400000); }
        function fmtRadarDate(d){ if(!d)return ''; const dt=new Date(d+'T00:00:00'); if(isNaN(dt))return ''; const loc=STATE.lang==='RO'?'ro-RO':'en-US'; return `${dt.getDate()} ${dt.toLocaleString(loc,{month:'short'}).toUpperCase().replace('.','')} ${dt.getFullYear()}`; }
        const tmdbImg=(p,size='w200')=>p?`https://image.tmdb.org/t/p/${size}${p}`:'';

        async function radarCheckItem(row, rows){
            rows=rows||STATE.data;
            const imdbId=extractImdbId(row[COL.IMDB]);
            if(!imdbId||!STATE.tmdbKey) return null;
            const lng=STATE.lang==='RO'?'ro-RO':'en-US';
            const find=await tmdbGet(tmdbUrl(`find/${imdbId}`,{external_source:'imdb_id'}));
            if(!find) return null;

            const base={ name:row[COL.NAME], grade:row[COL.GRADE], poster:row[COL.POSTER], imdbId,
                         owned:parseOwned(COL.EXTRA!==undefined?row[COL.EXTRA]:'') };

            if(find.tv_results?.length){
                const id=find.tv_results[0].id;
                const tv=await tmdbGet(tmdbUrl(`tv/${id}`,{language:lng}));
                if(!tv) return null;
                const seasons=(tv.seasons||[]).filter(s=>s.season_number>0 && (s.episode_count||0)>0);
                if(!seasons.length) return null;
                const last=seasons[seasons.length-1];
                const totalSeasons=seasons.length;
                const ownedSeasons=base.owned.seasons;
                const totalEpisodes=seasons.reduce((a,s)=>a+(s.episode_count||0),0);

                const lastAir=tv.last_episode_to_air, nextAir=tv.next_episode_to_air;
                const total=last.episode_count||0;
                let aired=0;
                if(lastAir && lastAir.season_number===last.season_number) aired=lastAir.episode_number||0;
                else if(last.air_date && last.air_date<=todayISO() && !nextAir) aired=total;
                const complete=total>0 && aired>=total && !nextAir;

                /* Ranked by how much it actually asks of the user */
                let kind='caught-up';
                if(ownedSeasons!=null && totalSeasons>ownedSeasons) kind='new-season';
                else if(nextAir) kind='airing';
                else if(ownedSeasons==null && totalSeasons>1) kind='airing';
                if(kind==='airing' && !nextAir && complete && /Ended|Canceled/i.test(tv.status||'')) kind='ended';
                if(kind==='caught-up') return null;

                return { ...base, type:'tv', tmdbId:id, tmdbTitle:tv.name,
                    tmdbPoster:tmdbImg(tv.poster_path), backdrop:tmdbImg(tv.backdrop_path,'w780'),
                    kind, statusRaw:tv.status||'', inProduction:!!tv.in_production,
                    seasonNum:last.season_number, seasonName:last.name, aired, total, complete,
                    seasonsOwned:ownedSeasons, seasonsTotal:totalSeasons,
                    episodesOwned:base.owned.episodes, episodesTotal:totalEpisodes,
                    network:(tv.networks||[])[0]?.name||'', vote:tv.vote_average||0,
                    overview:tv.overview||'', firstAir:tv.first_air_date||'',
                    nextEp:nextAir?{n:nextAir.episode_number,s:nextAir.season_number,name:nextAir.name,date:nextAir.air_date}:null,
                    lastEp:lastAir?{n:lastAir.episode_number,s:lastAir.season_number,name:lastAir.name,date:lastAir.air_date}:null,
                    refDate:(nextAir?.air_date)||(lastAir?.air_date)||last.air_date||null };
            }

            if(find.movie_results?.length){
                const id=find.movie_results[0].id;
                const movie=await tmdbGet(tmdbUrl(`movie/${id}`,{language:lng}));
                if(!movie?.belongs_to_collection) return null;
                const coll=await tmdbGet(tmdbUrl(`collection/${movie.belongs_to_collection.id}`,{language:lng}));
                if(!coll?.parts?.length) return null;
                const have=new Set(rows.map(r=>normTitle(r[COL.NAME])).filter(Boolean));
                const missing=coll.parts.filter(p=>{
                    const a=normTitle(p.title), b=normTitle(p.original_title);
                    return !(a&&have.has(a)) && !(b&&have.has(b));
                }).map(p=>({ title:p.title, date:p.release_date||'', vote:p.vote_average||0,
                             poster:tmdbImg(p.poster_path,'w92'), overview:p.overview||'',
                             upcoming:!p.release_date || p.release_date>todayISO() }))
                  .sort((a,b)=>cmpStr(String(a.date),String(b.date)));
                if(!missing.length) return null;
                const released=missing.filter(m=>!m.upcoming);
                return { ...base, type:'movie', tmdbId:id, tmdbTitle:movie.title,
                    tmdbPoster:tmdbImg(movie.poster_path), backdrop:tmdbImg(movie.backdrop_path,'w780'),
                    kind:released.length?'new-movie':'upcoming',
                    collection:movie.belongs_to_collection.name||'', overview:movie.overview||'',
                    vote:movie.vote_average||0, newMovies:missing,
                    refDate:(released[released.length-1]||missing[0]).date||null };
            }
            return null;
        }

        async function runRadar(){
            if(!STATE.tmdbKey){ sTst(t('rdrNoKey'),'error'); oMod('stg'); return; }
            if(RDR_SCANNING){ RDR_ABORT?.abort(); return; }
            const items=rdrEligible().filter(r=>extractImdbId(r[COL.IMDB]));
            const rows=[...STATE.data];

                while(idx<items.length){

                    const r=items[idx++];
                    try{ const res=await radarCheckItem(r, rows); if(res) found.push(res); }
                    catch(e){ RDR_STATS.errors++; }
                    RDR_STATS.done++; rdrProgress();
                }

        /* ---------- grade range: "8-10", "7+", "7", "6.5-9" ---------- */
        const pfNum = x => parseFloat(String(x).replace(',','.'));
        function parseGradeRange(v){
            const s=String(v||'').trim();
            if(!s) return {min:0,max:10};
            if(/^(any|orice|all|tot|toate)/i.test(s)) return {min:0,max:10};
            let m=s.match(/^(\d{1,2}(?:[.,]\d+)?)\s*[-\u2013\u2014\u2192]\s*(\d{1,2}(?:[.,]\d+)?)$/);
            if(m){ const a=pfNum(m[1]), b=pfNum(m[2]); if(isNaN(a)||isNaN(b))return null; return {min:Math.min(a,b), max:Math.max(a,b)}; }
            m=s.match(/^(\d{1,2}(?:[.,]\d+)?)\s*\+$/);
            if(m){ const a=pfNum(m[1]); return isNaN(a)?null:{min:a,max:10}; }
            m=s.match(/^(\d{1,2}(?:[.,]\d+)?)$/);
            if(m){ const a=pfNum(m[1]); return isNaN(a)?null:{min:a,max:10}; }
            return null;
        }

        async function sCld(){
            flushLib();
            if(!STATE.url) return sTst(t("mNC"),"error"), oMod('stg');
            const b=$('btn-sv'); if(b.disabled)return false;
            /* never push an empty sheet: this is what a failed first load looks like, and it would wipe the cloud copy */

            try{ WRITE: {

                const pre=await chkCloud(STATE.url, STATE.pass, savedSheet);
                if(pre && pre.ok && Array.isArray(pre.values)){
                    let msg=null;
                    if(CLOUD_BASE[savedSheet]!==undefined){
                        let base=[]; try{ base=JSON.parse(CLOUD_BASE[savedSheet]); }catch(e){}
                        if(!cloudMatches(pre.values, base)) msg=t('mCfl');            /* changed by someone/something else since we loaded it */
                    } else if(!PENDING_IMPORT.has(savedSheet) && pre.values.length>1){
                        msg=t('mNoBase');                                              /* never loaded from the cloud in this session (load failed / offline start) */
                    }
                    if(msg && !(await askYesNo(msg))){ sTst(t('mSvBad'),'info'); break WRITE; }
                }
                const p={action:'write',pass:STATE.pass,sheet:savedSheet,values:[STATE.hdrs,...STATE.data],config:{
                    FONT_SIZE:STATE.dPc.fs,H_ALIGN:STATE.dPc.ha,V_ALIGN:STATE.dPc.va,T_WRAP:STATE.dPc.wr,HIDDEN_COLS:JSON.stringify(STATE.dPc.hC),
                    DISPLAY_PC:JSON.stringify(pickDisplay(STATE.dPc)), DISPLAY_MOBILE:JSON.stringify(pickDisplay(STATE.dMb)),
                    FONT_SIZE_MOBILE:STATE.dMb.fs,H_ALIGN_MOBILE:STATE.dMb.ha,V_ALIGN_MOBILE:STATE.dMb.va,T_WRAP_MOBILE:STATE.dMb.wr,HIDDEN_COLS_MOBILE:JSON.stringify(STATE.dMb.hC),
                    COLOR_RULES:STATE.cR,COLOR_FORMATTING:STATE.cF,HIDDEN_TABS:JSON.stringify(STATE.hT),LANG:STATE.lang,THEME:STATE.theme,ALL_TABS:JSON.stringify(STATE.aT),VIEW_MODE:STATE.vM,TRACK:STATE.track,REDUCE_MOTION:STATE.reduceMotion
                }};
                /* Read Apps Script's real answer: a text/plain POST needs no preflight and the web app
                   answers with Access-Control-Allow-Origin:*. Only when the browser still blocks it do we
                   fall back to the old blind no-cors send ("blind": we cannot see a refusal). */
                let blind=false, srv=null;
                try{
                    const rr=await fetchTo(STATE.url,{method:'POST',body:JSON.stringify(p)},60000);
                    try{ srv=await rr.json(); }catch(_){ srv=null; }
                }catch(err){
                    if(err && (err.name==='AbortError'||err.name==='TimeoutError')) throw err; /* a timeout is a failure, not a CORS block */
                    blind=true;

                }
                if(srv && srv.ok===false){ sTst(srv.error||t('mF'),'error'); break WRITE; } /* refused: nothing was written */
                if(!blind && !srv) blind=true; /* answered, but not with JSON: judge by the read-back only */
                /* poll a few times: the sheet can take a moment to show the write */
                let vd=null, match=false, reached=false;
                for(let attempt=0; attempt<3 && !match; attempt++){
                    await new Promise(r=>setTimeout(r, attempt===0?(blind?800:0):1400)); /* confirmed by the server: read back at once */
                    vd=await chkCloud(STATE.url, STATE.pass, savedSheet);
                    if(vd&&vd.ok&&Array.isArray(vd.values)){ reached=true; match=cloudMatches(vd.values, p.values); }
                }
                if(match){ sTst(t("mSv")); setUns(false); ls('cfgDirty',''); STATE.lastSaved=Date.now(); ls('lastSaved',STATE.lastSaved); vibSv(); CLOUD_BASE[savedSheet]=JSON.stringify(vd.values); PENDING_IMPORT.delete(savedSheet); ok=true; }

                else if(reached){ sTst(t("mSvUnk"),"error"); CLOUD_BASE[savedSheet]=JSON.stringify(vd.values); } /* blind send and the cloud does not show it: NOT saved, the local changes stay */
                else { sTst((vd&&vd.error)||t("mF"),"error"); }
            } }catch(e){sTst(t("mF"),"error");}

               for good, so the "saved N min ago" label vanished after the first save */
            b.disabled=false; b.innerHTML=`${ic('cloud-arrow-up')} <span id="last-saved" class="font-bold uppercase tracking-wide" style="white-space:nowrap;"></span> <span id="uns-dot" class="absolute top-0 right-0 rounded-full bg-white shadow-md border-2 border-black" style="display:${STATE.uns?'flex':'none'};"></span>`;
