    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; --text-color: #ffffff; --card-bg: #141414; --border-color: rgba(255,255,255,0.25);
            --input-bg: #000000; --text-muted: #6b7280; --table-hover: rgba(255,255,255,0.05); --control-bg: rgba(0,0,0,0.3);
            --poster-bg: #080808; --active-tab-bg: rgba(255,255,255,0.05); --active-tab-text: #ffffff;
            --app-font-size: 14px; --t-ha: center; --t-va: middle; --t-wr: normal;
            --theme-accent: #e50914; --active-tab-border: var(--theme-accent);
        }
        
        body.light-theme {
            --bg-color:#f0f2f5; --text-color:#111827; --card-bg:#ffffff; --border-color:rgba(0,0,0,0.25);
            --input-bg:#f3f4f6; --text-muted:#4b5563; --table-hover:rgba(0,0,0,0.02); --control-bg:rgba(0,0,0,0.03);
            --poster-bg:#eaeaea; --active-tab-bg:rgba(0,0,0,0.03); --active-tab-text:#111827;
        }
        
        body { background: var(--bg-color); color: var(--text-color); margin: 0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; transition: all .3s; }
        
        /* CUSTOM UTILITY COMPONENTS */
        .btn { font-weight:900; text-transform:uppercase; transition:all .3s; display:flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; padding:.75rem; font-size:.75rem; cursor:pointer; box-shadow:0 4px 6px -1px rgba(0,0,0,.1); border:none; }
        .btn:disabled, .btn-p:disabled, .btn-s:disabled { opacity:.6; cursor:not-allowed; pointer-events:none; }
        .btn:active, .btn-p:active, .btn-s:active, .btn-i:active { transform:scale(.96); }
        .btn-p { background:var(--theme-accent); color:#fff; } .btn-p:hover { filter:brightness(.85); }
        .btn-s { background:transparent; color:var(--text-color); border:1px solid color-mix(in srgb, var(--theme-accent) 20%, transparent); } .btn-s:hover { background:var(--theme-accent); color:#fff; }
        .btn-i { background:transparent; border:1px solid var(--border-color); color:var(--theme-accent); padding:.5rem; border-radius:.75rem; font-size:.5rem; flex-direction:column; gap:.25rem; } .btn-i:hover { background:rgba(128,128,128,0.1); }
        .inp { background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); width:100%; border-radius:.75rem; padding:.875rem; font-size:.75rem; font-weight:700; outline:none; transition:all .3s; box-sizing:border-box; }
        .inp:focus { box-shadow:0 0 0 2px color-mix(in srgb, var(--theme-accent) 50%, transparent); }
        :focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 2px; }
        .inp:focus-visible { outline: none; }
        .lbl { font-size:.625rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin:0 0 .25rem .25rem; display:block; }
        .h-sub { font-size:.6875rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin-bottom:.75rem; }
        input[type="color"] { -webkit-appearance:none; appearance:none; width:44px; height:44px; padding:0; border:1px solid var(--border-color); border-radius:.75rem; background:var(--input-bg); cursor:pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding:4px; }
        input[type="color"]::-webkit-color-swatch, input[type="color"]::-moz-color-swatch { border:none; border-radius:.5rem; }
        
        /* Tailwind is loaded from a CDN; if it is blocked, .hidden stops existing and every
           element the app hides would stay on screen. Define it locally as well. */
        .hidden { display:none !important; }

        /* Safety net: if the icon font fails to load (offline, blocked CDN, ad blocker) an
           icon-only button would collapse to zero size and become unclickable. Reserve the box. */
        i.fas, i.fab { display:inline-block; min-width:1em; min-height:1em; font-style:normal; }

        /* ===== SETTINGS PANEL: pill-shaped controls ===== */
        .set-sec { margin-bottom:1.75rem; }
        .set-hd { display:flex; align-items:center; gap:.5rem; margin-bottom:.25rem; }
        .set-hd i { color:var(--theme-accent); font-size:.8125rem; width:1.125rem; text-align:center; flex-shrink:0; }
        .set-ttl { font-size:.75rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; color:var(--text-color); }
        .set-hint { font-size:.6875rem; font-weight:500; color:var(--text-muted); line-height:1.45; margin:0 0 .75rem 1.625rem; }
        .set-badge { display:inline-flex; align-items:center; gap:.375rem; margin-top:.625rem; padding:.3125rem .75rem; border-radius:999px; font-size:.5625rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; line-height:1.4; background:color-mix(in srgb, var(--theme-accent) 14%, transparent); color:var(--theme-accent); }
        .set-card { padding:1.125rem; border-radius:1.5rem; border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); background:var(--input-bg); }

        /* segmented control (one choice out of N) */
        .seg { display:flex; gap:.25rem; padding:.25rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); }
        .seg-btn { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:.375rem; padding:.625rem .5rem; border:none; border-radius:999px; background:transparent; color:var(--text-muted); font-family:inherit; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; cursor:pointer; transition:background .2s, color .2s, transform .15s, box-shadow .2s; }
        .seg-btn i { font-size:.75rem; flex-shrink:0; }
        .seg-btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .seg-btn:hover { color:var(--text-color); background:color-mix(in srgb, var(--theme-accent) 10%, transparent); }
        .seg-btn.on { background:var(--theme-accent); color:#fff; box-shadow:0 1px 6px color-mix(in srgb, var(--theme-accent) 35%, transparent); }
        .seg-btn.on:hover { background:var(--theme-accent); filter:brightness(1.05); }
        .seg-btn:active { transform:scale(.95); }

        /* switch row (an explicit on/off setting with its own explanation) */
        .sw-row { display:flex; align-items:center; gap:.75rem; width:100%; box-sizing:border-box; padding:.75rem .875rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); cursor:pointer; font-family:inherit; color:var(--text-color); text-align:left; transition:border-color .2s, background .2s, transform .15s; }
        .sw-row + .sw-row { margin-top:.5rem; }
        .sw-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 50%, transparent); background:color-mix(in srgb, var(--theme-accent) 6%, var(--input-bg)); }
        .sw-row:active { transform:scale(.99); }
        .sw-ico { flex:0 0 auto; width:1.875rem; height:1.875rem; border-radius:999px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--theme-accent) 12%, transparent); color:var(--theme-accent); font-size:.75rem; transition:background .2s; }
        .sw-row.on .sw-ico { background:color-mix(in srgb, var(--theme-accent) 22%, transparent); }
        .sw-txt { flex:1 1 auto; min-width:0; }
        .sw-name { display:block; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; line-height:1.3; }
        .sw-sub { display:block; font-size:.625rem; font-weight:500; color:var(--text-muted); line-height:1.35; margin-top:.0625rem; }
        .sw-state { flex:0 0 auto; min-width:2.25rem; text-align:right; font-size:.5625rem; font-weight:900; text-transform:uppercase; color:var(--text-muted); letter-spacing:.02em; }
        .sw-row.on .sw-state { color:var(--theme-accent); }
        .sw-tgl { flex:0 0 auto; width:2.375rem; height:1.375rem; border-radius:999px; background:color-mix(in srgb, var(--text-muted) 50%, transparent); position:relative; transition:background .25s; }
        .sw-tgl::after { content:''; position:absolute; top:.125rem; left:.125rem; width:1.125rem; height:1.125rem; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.45); transition:transform .25s; }
        .sw-row.on .sw-tgl { background:var(--theme-accent); }
        .sw-row.on .sw-tgl::after { transform:translateX(1rem); }

        /* toggle pills (visible categories / visible columns) */
        .pill-wrap { display:flex; flex-wrap:wrap; gap:.4375rem; }
        .pill { display:inline-flex; align-items:center; gap:.375rem; padding:.4375rem .8125rem; border-radius:999px; font-family:inherit; font-size:.625rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; cursor:pointer; border:1px solid transparent; transition:background .2s, color .2s, border-color .2s, transform .15s; }
        .pill i { font-size:.5625rem; opacity:.9; }
        .pill.on { background:var(--theme-accent); color:#fff; border-color:var(--theme-accent); }
        .pill.on:hover { filter:brightness(1.08); }
        .pill.off { background:transparent; color:var(--text-muted); border-color:color-mix(in srgb, var(--theme-accent) 22%, transparent); }
        .pill.off:hover { color:var(--text-color); border-color:color-mix(in srgb, var(--theme-accent) 55%, transparent); }
        .pill:active { transform:scale(.94); }

        /* action row: same pill shape as a switch, but it performs something */
        .act-row { display:flex; align-items:center; gap:.75rem; width:100%; box-sizing:border-box; padding:.75rem .875rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); cursor:pointer; font-family:inherit; color:var(--text-color); text-align:left; transition:border-color .2s, background .2s, transform .15s; }
        .act-row + .act-row { margin-top:.5rem; }
        .act-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 50%, transparent); background:color-mix(in srgb, var(--theme-accent) 6%, var(--input-bg)); }
        .act-row:active { transform:scale(.99); }
        .act-go { flex:0 0 auto; width:1.75rem; height:1.75rem; border-radius:999px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--theme-accent) 12%, transparent); color:var(--theme-accent); font-size:.625rem; transition:background .2s, color .2s, transform .2s; }
        .act-row:hover .act-go { background:var(--theme-accent); color:#fff; transform:translateX(2px); }

        /* storage usage meter */
        .meter { height:.4375rem; border-radius:999px; background:color-mix(in srgb, var(--text-muted) 28%, transparent); overflow:hidden; }
        .meter-fill { display:block; height:100%; border-radius:999px; background:var(--theme-accent); transition:width .45s ease; }
        .meter-fill.warn { background:#f0a020; }
        .meter-fill.full { background:#e0342c; }
        .meter-cap { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; margin-bottom:.4375rem; font-size:.625rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; }
        .meter-cap b { color:var(--theme-accent); font-weight:900; }
        .meter-note { font-size:.625rem; font-weight:500; color:var(--text-muted); line-height:1.4; margin-top:.4375rem; }

        /* danger card */
        .set-card.danger { border-color:color-mix(in srgb, var(--theme-accent) 38%, transparent); background:color-mix(in srgb, var(--theme-accent) 8%, transparent); }
        .btn-danger { display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%; box-sizing:border-box; padding:.75rem; border-radius:999px; font-family:inherit; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; background:transparent; color:var(--theme-accent); border:1px solid color-mix(in srgb, var(--theme-accent) 45%, transparent); transition:background .2s, color .2s, transform .15s; }
        .btn-danger:hover { background:var(--theme-accent); color:#fff; border-color:var(--theme-accent); }
        .btn-danger:active { transform:scale(.97); }

        .inp-pill { border-radius:999px; text-align:center; }
        .btn-pill { border-radius:999px; padding:.9375rem; font-size:.8125rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em; }
        @media (max-width:420px) {
            .seg-btn { font-size:.625rem; padding:.5625rem .375rem; }
            .sw-sub { display:none; }
        }

        /* SPECIFIC APP ELEMENTS */
        .main-wrapper { width:100%; max-width:1280px; margin:0 auto; padding:24px; box-sizing:border-box; overflow-x:hidden; }
        @media (max-width: 768px) { .main-wrapper { padding:12px; } }
        
        .loading-bar { position:sticky; top:0; width:100%; height:5px; background:#111; z-index:1000; display:none; }
        .progress { height:100%; background:var(--theme-accent); transition:width .3s; box-shadow:0 0 10px var(--theme-accent); }
        .theme-card { background:var(--card-bg); border:1px solid var(--border-color); transition:all .3s; }
        .theme-text { color:var(--text-color); }
        .hover-theme:hover { color:var(--text-color); }
        #b-rows { font-size:var(--app-font-size); } 
        .name-cell { font-size:calc(var(--app-font-size) + 6px)!important; font-weight:900; min-width:250px; }
        #nav button { font-size:calc(var(--app-font-size) - 2px); flex-shrink: 0; padding:9.6px 12.8px; }
        @media (min-width:768px) { #nav button { padding:12.8px 19.2px; } }
        #h-row th { font-size:calc(var(--app-font-size) - 3px); padding:8px; }
        .imdb-link { background:#f5c518; color:#000!important; padding:5px 10px; border-radius:4px; font-weight:900; font-size:11px; text-decoration:none; display:inline-flex; align-items:center; letter-spacing:-.5px; transition:transform .1s; } .imdb-link:hover { transform:scale(1.05); filter:brightness(1.1); }
        .poster-container { width:44px; height:64px; flex-shrink:0; overflow:hidden; position:relative; border:1px solid var(--border-color); border-radius:5px; display:flex; align-items:center; justify-content:center; background:var(--poster-bg); }
        /* fill (cover) by default so every poster is the same size; body.po-fit switches to contain */
        .poster-img { width:100%; height:100%; object-fit:cover; object-position:center; cursor:zoom-in; position:relative; z-index:10; border-radius:3px; display:block; }
        #zoom-preview { position:fixed; z-index:9999; pointer-events:none; border-radius:6px; box-shadow:10px 0 30px rgba(0,0,0,.9); outline:2px solid var(--theme-accent); object-fit:cover; display:none; }
        td,th { border:0; text-align:var(--t-ha); vertical-align:var(--t-va); white-space:var(--t-wr); padding:9px 10px; transition:background-color .2s; } tr:hover { background-color:var(--table-hover)!important; }
        .no-cell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
        .no-val { font-weight:900; }
        .no-arrow { background:transparent; border:none; color:var(--theme-accent); cursor:pointer; padding:0; margin:0; width:24px; height:13.2px; font-size:9.6px; line-height:13.2px; opacity:0; transition:opacity .15s ease; }
        tr:hover .no-arrow:not(:disabled) { opacity:.75; }
        .no-arrow:hover:not(:disabled) { opacity:1; }
        .no-arrow:disabled { visibility:hidden; cursor:default; }
        .rw-cell { display:flex; align-items:center; justify-content:center; gap:4px; }
        .rw-val { font-weight:900; min-width:14px; text-align:center; }
        .active-tab { border-bottom:3px solid var(--active-tab-border); color:var(--active-tab-text); background:var(--active-tab-bg); }
        .control-col { width:54px; min-width:54px; background:var(--control-bg); text-align:center; }
        .grade-cell { max-width:5ch; width:5ch; white-space:nowrap; }
        .grade-next { color:#00ff88!important; font-weight:900; }
        .grade-drop { color:#ff4444!important; font-weight:900; }
        /* ---- density: poster, padding and pill count move together ---- */
        .dens-compact  { --dens-po-w:34px; --dens-po-h:51px; --dens-pad:4px 8px;  --dens-tp:2px 7px; }
        .dens-normal   { --dens-po-w:44px; --dens-po-h:66px; --dens-pad:9px 10px; --dens-tp:3px 9px; }
        .dens-spacious { --dens-po-w:58px; --dens-po-h:87px; --dens-pad:15px 12px;--dens-tp:5px 11px; }
        body[class*="dens-"] .poster-container { width:var(--po-w, var(--dens-po-w)); height:var(--po-h, var(--dens-po-h)); }
        body[class*="dens-"] #tbl-box td, body[class*="dens-"] #tbl-box th { padding:var(--dens-pad); }
        body[class*="dens-"] #tbl-box .tp { padding:var(--dens-tp); }
        body.is-mobile.dens-compact  { --dens-po-w:30px; --dens-po-h:44px; }
        body.is-mobile.dens-normal   { --dens-po-w:40px; --dens-po-h:58px; }
        body.is-mobile.dens-spacious { --dens-po-w:50px; --dens-po-h:72px; }

        /* ---- numeric steppers ---- */
        .stp-row { display:flex; align-items:center; gap:.75rem; width:100%; box-sizing:border-box; padding:.625rem .875rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); }
        .stp-row + .stp-row { margin-top:.5rem; }
        .stp-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 40%, transparent); }
        .stp { display:flex; align-items:center; gap:.25rem; flex-shrink:0; padding:.1875rem; border-radius:999px; background:var(--card-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 22%, transparent); }
        .stp-btn { display:flex; align-items:center; justify-content:center; width:1.5rem; height:1.5rem; border:none; border-radius:999px; background:transparent; color:var(--theme-accent); font-size:.625rem; cursor:pointer; transition:background .15s, transform .12s; }
        .stp-btn:hover { background:color-mix(in srgb, var(--theme-accent) 16%, transparent); }
        .stp-btn:active { transform:scale(.88); }
        .stp-btn:disabled { opacity:.3; cursor:not-allowed; }
        .stp-val { width:2.6rem; border:none; outline:none; background:transparent; color:var(--text-color); font-family:inherit; font-size:.75rem; font-weight:900; text-align:center; -moz-appearance:textfield; }
        .stp-val::-webkit-outer-spin-button, .stp-val::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
        .stp-unit { flex-shrink:0; min-width:1.75rem; font-size:.5625rem; font-weight:900; text-transform:uppercase; color:var(--text-muted); letter-spacing:.02em; }
        .fine-reset { display:inline-flex; align-items:center; gap:.375rem; margin-top:.625rem; padding:.375rem .875rem; border-radius:999px; background:transparent; border:1px dashed color-mix(in srgb, var(--theme-accent) 40%, transparent); color:var(--theme-accent); font-family:inherit; font-size:.5625rem; font-weight:900; text-transform:uppercase; cursor:pointer; }
        .fine-reset:hover { background:color-mix(in srgb, var(--theme-accent) 12%, transparent); }
        #po-ratio { margin-left:.5rem; font-family:ui-monospace,monospace; font-weight:900; color:var(--theme-accent); }
        .ww-cell { white-space:normal !important; }
        tr.row-sentinel, tr.row-sentinel td { height:1px; padding:0 !important; border:0 !important; background:transparent !important; }
        body.po-fit .poster-img { object-fit:contain; }

        /* ---- clean report ---- */
        .cl-sec { margin-bottom:1.25rem; }
        .cl-hd { display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.03em; color:var(--text-color); }
        .cl-hd i { color:var(--theme-accent); font-size:.75rem; width:1rem; text-align:center; }
        .cl-hd b { margin-left:auto; padding:.125rem .5rem; border-radius:999px; background:color-mix(in srgb, var(--theme-accent) 16%, transparent); color:var(--theme-accent); font-size:.625rem; }
        .cl-row { display:flex; align-items:center; gap:.5rem; padding:.4375rem .625rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 12%, transparent); margin-bottom:.3125rem; }
        .cl-name { flex:1; min-width:0; font-size:.6875rem; font-weight:700; color:var(--text-color); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .cl-btn { flex-shrink:0; padding:.1875rem .625rem; border-radius:999px; border:1px solid color-mix(in srgb, var(--theme-accent) 40%, transparent); background:transparent; color:var(--theme-accent); font-family:inherit; font-size:.5625rem; font-weight:900; text-transform:uppercase; cursor:pointer; }
        .cl-btn:hover { background:var(--theme-accent); color:#fff; }
        .cl-btn:disabled { opacity:.5; cursor:wait; }
        .cl-group { padding:.375rem; border-radius:1rem; border:1px dashed color-mix(in srgb, var(--theme-accent) 35%, transparent); margin-bottom:.4375rem; }
        .cl-group .cl-row { margin-bottom:.25rem; } .cl-group .cl-row:last-child { margin-bottom:0; }
        .cl-none { font-size:.6875rem; font-weight:500; color:var(--text-muted); margin:0 0 0 1.5rem; opacity:.8; }
        .cl-note { font-size:.625rem; font-weight:500; color:var(--text-muted); margin:0 0 .5rem 1.5rem; line-height:1.5; }
        .cl-note b { color:var(--theme-accent); font-weight:900; }
        .cl-fixall { display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%; box-sizing:border-box; padding:.5rem; margin-bottom:.5rem; border-radius:999px; border:none; background:var(--theme-accent); color:#fff; font-family:inherit; font-size:.625rem; font-weight:900; text-transform:uppercase; letter-spacing:.03em; cursor:pointer; }
        .cl-fixall:hover { filter:brightness(1.08); }
        .cl-fixall:disabled { opacity:.7; cursor:wait; }

        /* ---- colour rule builder ---- */
        .cr-row { display:flex; align-items:center; gap:.375rem; padding:.4375rem .5rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 15%, transparent); margin-bottom:.375rem; }
        .cr-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 40%, transparent); }
        .cr-dot { flex-shrink:0; width:.875rem; height:.875rem; border-radius:999px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18); }
        .cr-row select, .cr-row input { font-family:inherit; font-weight:700; color:var(--text-color); background:transparent; border:none; outline:none; border-radius:999px; padding:.25rem .4375rem; font-size:.6875rem; }
        .cr-row select:focus, .cr-row input:focus { background:color-mix(in srgb, var(--theme-accent) 12%, transparent); }
        .cr-col { flex:0 0 5.5rem; text-transform:uppercase; }
        .cr-val { flex:1 1 auto; min-width:3rem; }
        .cr-style { flex:0 0 4.5rem; text-transform:uppercase; font-size:.625rem !important; }
        .cr-size { flex:0 0 2.75rem; text-align:center; }
        .cr-color { -webkit-appearance:none; appearance:none; flex:0 0 1.75rem; width:1.75rem; min-width:1.75rem; height:1.75rem; padding:0; border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); border-radius:999px; overflow:hidden; cursor:pointer; background:transparent; }
        .cr-color::-webkit-color-swatch-wrapper { padding:0; }
        .cr-color::-webkit-color-swatch { border:none; border-radius:999px; }
        .cr-del { flex:0 0 1.5rem; width:1.5rem; height:1.5rem; border:none; border-radius:999px; background:transparent; color:var(--text-muted); cursor:pointer; font-size:.6875rem; }
        .cr-del:hover { background:rgba(224,52,44,.16); color:#e0342c; }
        .cr-bad { border-color:rgba(224,52,44,.5); }
        .cr-warn { color:#e0342c; font-size:.75rem; }
        .cr-raw { flex:1; font-family:ui-monospace,monospace; font-size:.625rem; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; }
        .cr-add { display:inline-flex; align-items:center; gap:.375rem; padding:.4375rem .875rem; border-radius:999px; background:transparent; border:1px dashed color-mix(in srgb, var(--theme-accent) 45%, transparent); color:var(--theme-accent); font-family:inherit; font-size:.625rem; font-weight:900; text-transform:uppercase; cursor:pointer; }
        .cr-add:hover { background:color-mix(in srgb, var(--theme-accent) 12%, transparent); }
        #cr-raw-wrap .cr-raw-body { display:none; margin-top:.5rem; }
        #cr-raw-wrap.open .cr-raw-body { display:block; }
        #cr-raw-btn { display:inline-flex; align-items:center; gap:.375rem; background:transparent; border:none; color:var(--text-muted); font-family:inherit; font-size:.5625rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; padding:.25rem 0; }
        #cr-raw-btn:hover { color:var(--theme-accent); }

        /* ---- pill table ---- */
        .tp { display:inline-flex; align-items:center; gap:4px; border-radius:999px; font-size:calc(var(--app-font-size) - 4px); font-weight:900; text-transform:uppercase; letter-spacing:.02em; padding:3px 9px; white-space:nowrap; line-height:1.35; }
        .tp-gen { background:color-mix(in srgb, var(--text-muted) 18%, transparent); color:var(--text-muted); }
        body.light-theme .tp-gen { background:rgba(0,0,0,.06); color:#4b5563; }
        .tp-rate { background:color-mix(in srgb, #f0a020 20%, transparent); color:#f0a020; }
        .tp-sea { background:color-mix(in srgb, #7c5cff 22%, transparent); color:#9d86ff; }
        body.light-theme .tp-sea { color:#5b3fd6; }
        .tp-ep { background:color-mix(in srgb, #12b981 20%, transparent); color:#2fd6a0; }
        body.light-theme .tp-ep { color:#0e8a60; }
        .tp-run { background:color-mix(in srgb, var(--text-muted) 18%, transparent); color:var(--text-muted); }
        .tp-raw { background:color-mix(in srgb, var(--text-muted) 14%, transparent); color:var(--text-muted); font-weight:700; text-transform:none; letter-spacing:0; }
        .tp-more { background:transparent; color:var(--text-muted); border:1px solid color-mix(in srgb, var(--theme-accent) 28%, transparent); cursor:pointer; font-family:inherit; }
        .tp-more:hover { color:var(--theme-accent); border-color:var(--theme-accent); }
        .cell-pills { touch-action:manipulation; display:flex; flex-wrap:wrap; white-space:nowrap; gap:4px; align-items:center; justify-content:var(--t-ha,center); cursor:text; min-height:24px; padding:2px; border-radius:10px; }
        .cell-pills:hover { background:color-mix(in srgb, var(--theme-accent) 6%, transparent); }
        .cell-pills:not(.all) .xtra { display:none; }
        .cell-pills.lp-arm { animation:lpFill .48s linear forwards; }
        @keyframes lpFill { from { box-shadow:inset 0 0 0 0 color-mix(in srgb, var(--theme-accent) 0%, transparent); } to { box-shadow:inset 0 0 0 2px var(--theme-accent); background:color-mix(in srgb, var(--theme-accent) 12%, transparent); } }
        @media (hover:none) { .cell-pills { cursor:default; } .cell-pills:hover { background:transparent; } }
        .cell-extra { flex-wrap:nowrap; }
        .cell-extra .tp { flex-shrink:0; }
        .cell-pills:empty::before, .cell-pills.is-empty::before { content:"\f304"; font-family:"Font Awesome 6 Free"; font-weight:900; color:var(--text-muted); opacity:.35; font-size:calc(var(--app-font-size) - 3px); }
        .pill-edit { width:100%; outline:none; border-radius:10px; padding:3px 8px; background:color-mix(in srgb, var(--theme-accent) 10%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--theme-accent) 45%, transparent); font-weight:700; }

        /* IMDB now lives inside the genres cell */
        .tp-imdb { background:#f5c518; color:#000 !important; text-decoration:none; padding-right:4px; }
        .tp-imdb:hover { filter:brightness(1.08); }
        .tp-imdb .imdb-pen { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border-radius:999px; background:rgba(0,0,0,.18); font-size:8px; }
        .tp-imdb .imdb-pen:hover { background:rgba(0,0,0,.38); }
        .tp-addlink { background:transparent; color:var(--text-muted); border:1px dashed color-mix(in srgb, var(--theme-accent) 35%, transparent); cursor:pointer; font-family:inherit; }
        .tp-addlink:hover { color:var(--theme-accent); border-color:var(--theme-accent); }

        /* grade as a badge */
        .grade-pill { display:inline-flex !important; align-items:center; justify-content:center; min-width:3.2ch; padding:3px 10px; border-radius:999px; font-weight:900 !important; background:color-mix(in srgb, var(--gp, var(--text-muted)) 20%, transparent); color:var(--gp, var(--text-color)) !important; }
        .grade-next.grade-pill { --gp:#12b981; } .grade-drop.grade-pill { --gp:#e0342c; }

        /* lighter grid: rows separate, columns do not */
        #tbl-box table { border-collapse:separate; border-spacing:0; }
        #tbl-box tbody td { border-bottom:1px solid color-mix(in srgb, var(--theme-accent) 9%, transparent); }
        #tbl-box tbody tr:hover td { background:color-mix(in srgb, var(--theme-accent) 5%, transparent); }
        #tbl-box thead th { border-bottom:1px solid color-mix(in srgb, var(--theme-accent) 22%, transparent); }

        /* popup menu for row / table actions */
        .pop-menu { position:fixed; z-index:2500; min-width:190px; padding:6px; border-radius:16px; background:var(--card-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); box-shadow:0 18px 40px rgba(0,0,0,.5); }
        .pop-item { display:flex; align-items:center; gap:10px; width:100%; box-sizing:border-box; padding:9px 12px; border:none; border-radius:999px; background:transparent; color:var(--text-color); font-family:inherit; font-size:11px; font-weight:900; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; text-align:left; transition:background .15s; }
        .pop-item i { width:14px; text-align:center; color:var(--theme-accent); font-size:11px; }
        .pop-item:hover { background:color-mix(in srgb, var(--theme-accent) 12%, transparent); }
        .pop-item.danger, .pop-item.danger i { color:#e0342c; }
        .pop-item.danger:hover { background:rgba(224,52,44,.14); }
        .pop-item:disabled { opacity:.4; cursor:not-allowed; }
        .pop-sep { height:1px; margin:5px 8px; background:color-mix(in srgb, var(--theme-accent) 18%, transparent); }
        .menu-btn { display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:999px; border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); background:transparent; color:var(--theme-accent); cursor:pointer; font-size:12px; transition:background .15s, transform .12s; }
        .menu-btn:hover { background:color-mix(in srgb, var(--theme-accent) 14%, transparent); }
        .menu-btn:active { transform:scale(.92); }

        .search-hl { background:color-mix(in srgb, var(--theme-accent) 18%, transparent)!important; border-radius:4px; }
        #s-col-btn { border-left:2px solid transparent; transition:border-color .2s ease, background-color .2s ease; }
        .group:hover #s-col-btn { border-left-color:color-mix(in srgb, var(--theme-accent) 60%, transparent); }
        #s-col-btn:hover, #s-col-btn:focus { background-color:color-mix(in srgb, var(--theme-accent) 12%, transparent); }
        #s-col-btn:focus { box-shadow:0 0 0 0.3px color-mix(in srgb, var(--theme-accent) 10%, transparent) !important; }
        #s-col-btn:focus-visible { outline:1px solid var(--theme-accent); outline-offset:1px; }
        #srch:focus, #srch:focus-visible { outline:none !important; box-shadow:0 0 0 0.3px color-mix(in srgb, var(--theme-accent) 10%, transparent) !important; }
        #srch:-webkit-autofill, #srch:-webkit-autofill:hover, #srch:-webkit-autofill:focus, #srch:-webkit-autofill:active { -webkit-box-shadow:0 0 0 1000px var(--card-bg) inset !important; box-shadow:0 0 0 1000px var(--card-bg) inset !important; -webkit-text-fill-color:var(--text-color) !important; caret-color:var(--text-color); transition:background-color 5000s ease-in-out 0s; }
        .s-col-list { display:none; position:absolute; top:calc(100% + 6px); right:0; min-width:100%; max-height:220px; overflow-y:auto; background:var(--card-bg); border:1px solid var(--border-color); border-radius:.6rem; box-shadow:0 8px 20px rgba(0,0,0,.35); z-index:300; }
        .s-col-list.open { display:block; }
        .s-col-opt { padding:8px 12px; font-size:var(--app-font-size); font-weight:700; text-transform:uppercase; color:var(--text-color); cursor:pointer; white-space:nowrap; }
        .s-col-opt:hover { background:color-mix(in srgb, var(--theme-accent) 15%, transparent); }
        .s-col-opt.active { background:var(--theme-accent); color:#fff; }
        #srch-wrap:hover { box-shadow:0 0 6px color-mix(in srgb, var(--theme-accent) 15%, transparent); }
        #btn-syncall { transition:transform .15s ease, filter .15s ease, box-shadow .15s ease; }
        #btn-syncall:hover { filter:brightness(1.15); transform:scale(1.08); box-shadow:0 0 8px color-mix(in srgb, var(--theme-accent) 60%, transparent); }
        #btn-syncall:active { transform:scale(.95); }

        /* RADAR: new seasons / new movies in a collection */
        /* ===== RADAR ===== */
        .range-inp { flex-shrink:0; width:4.5rem; padding:.3125rem .5rem; border-radius:999px; border:1px solid color-mix(in srgb, var(--theme-accent) 30%, transparent); background:var(--card-bg); color:var(--text-color); font-family:inherit; font-size:.75rem; font-weight:900; text-align:center; outline:none; transition:border-color .2s, box-shadow .2s; }
        .range-inp:focus { border-color:var(--theme-accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--theme-accent) 18%, transparent); }
        .range-inp.bad { border-color:#e0342c; color:#e0342c; }
        .srch-ov { font-size:.6875rem; font-weight:400; line-height:1.5; color:var(--text-muted); margin:.5rem 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        #rdr-grade-list.s-col-list, #rdr-grade-list { max-height:16rem; overflow-y:auto; }
        .rdr-cat { display:inline-flex; align-items:center; gap:.375rem; padding:.3125rem .75rem; border-radius:999px; font-size:.5625rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; background:color-mix(in srgb, var(--theme-accent) 14%, transparent); color:var(--theme-accent); }
        .rdr-setup { text-align:left; }
        .rdr-scan { display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%; box-sizing:border-box; padding:.875rem; border:none; border-radius:999px; background:var(--theme-accent); color:#fff; font-family:inherit; font-size:.8125rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; transition:filter .2s, transform .15s; }
        .rdr-scan:hover { filter:brightness(1.08); } .rdr-scan:active { transform:scale(.97); }
        .rdr-scan.scanning { background:transparent; color:var(--theme-accent); border:1px solid color-mix(in srgb, var(--theme-accent) 45%, transparent); }
        .rdr-prog { margin-top:.75rem; }
        .rdr-prog-cap { display:flex; justify-content:space-between; align-items:baseline; font-size:.625rem; font-weight:900; text-transform:uppercase; color:var(--text-muted); margin-bottom:.375rem; }
        .rdr-tabs { display:flex; flex-wrap:wrap; gap:.375rem; margin-bottom:.75rem; }

        /* MODAL OPEN/CLOSE TRANSITION */
        #m-mod { opacity:0; visibility:hidden; pointer-events:none; transition:opacity .25s ease, visibility 0s linear .25s; }

        body.is-mobile #nxt-flt { position: fixed !important; bottom: calc(0.5rem + env(safe-area-inset-bottom)) !important; left: 1.5rem !important; width: 2.8rem !important; height: 2.8rem !important; border-radius: 9999px !important; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5) !important; z-index: 1500 !important; padding: 0 !important; font-size: 1rem !important; background-color: var(--card-bg); border: 2px solid var(--theme-accent); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {

                scroll-behavior: auto !important;
            }

        }
        body.force-reduced-motion *, body.force-reduced-motion *::before, body.force-reduced-motion *::after {
            animation-duration: 0.001ms !important;

            transition-duration: 0.001ms !important;
            scroll-behavior: auto !important;
        }
        body.force-reduced-motion .hl-pulse { animation-duration: 0.001ms !important; }
    </style>

        /* Rows below the first screen are added only as the user scrolls towards them. Filling the

        const FIRST_ROWS=40, BATCH_ROWS=40;

        /* The table scrolls inside #tbl-box, not the page. The observer has to use that box as its
           root, otherwise the 1200px look-ahead is applied to the viewport and the box clips it away,
           so rows would only appear after the user had already hit the bottom. */
        function ensureRowObserver(){
            if(!('IntersectionObserver' in window)) return;
            const box=DOM.br.closest('#tbl-box');
            const cs=box?getComputedStyle(box):null;

            if(ROW_IO && ROW_IO.root===root) return;

            if(!RENDER_PENDING) return;

            tr.innerHTML='<td colspan="99"></td>';
            DOM.br.appendChild(tr);
            if(ROW_IO) ROW_IO.observe(tr); else setTimeout(loadMoreRows, 50);
        }
        function loadMoreRows(){
            const p=RENDER_PENDING; if(!p || p.gen!==RENDER_GEN) return;
            const s=DOM.br.querySelector('tr.row-sentinel'); if(s){ ROW_IO&&ROW_IO.unobserve(s); s.remove(); }
            const to=Math.min(p.at+BATCH_ROWS, p.total);

        /* ============================ RADAR ============================
           Scans the current category against TMDB and reports what changed since you
           last watched. Compared with the old version it:
             - reads how many seasons/episodes YOU have from the EXTRA column and reports
               the gap, instead of only describing TMDB's latest season
             - no longer requires "Returning Series", so a finished show that dropped a
               final season you never added is still reported
             - spends 2 requests per title instead of 3 (aired counts come from
               last_episode_to_air rather than a full season fetch)
             - caches every response, retries on HTTP 429 and surfaces real errors
             - can expand a card to pull the full episode list on demand
        */
        function extractImdbId(v){ const m=String(v||'').match(/tt\d{6,9}/); return m?m[0]:null; }

        const RDR_CACHE=new Map();
        let RDR_ABORT=null, RDR_SCANNING=false, RDR_STATS={done:0,total:0,errors:0,limited:0};
        const sleep=ms=>new Promise(r=>setTimeout(r,ms));

        /* Cached GET with backoff. TMDB answers 429 with a Retry-After header when you go
           over its rate limit; the old code treated that as "nothing new" and moved on. */
        async function tmdbGet(url, tries=3){
            if(RDR_CACHE.has(url)) return RDR_CACHE.get(url);
            for(let i=0;i<tries;i++){
                if(RDR_ABORT?.signal?.aborted) return null;
                try{
                    const r=await fetch(url, RDR_ABORT?{signal:RDR_ABORT.signal}:undefined);
                    if(r.status===429){
                        RDR_STATS.limited++;
                        const wait=(parseInt(r.headers.get('retry-after'),10)||1)*1000;
                        await sleep(Math.min(wait, 8000)); continue;
                    }
                    if(r.status===404){ RDR_CACHE.set(url,null); return null; }
                    if(!r.ok){ RDR_STATS.errors++; RDR_CACHE.set(url,null); return null; }
                    const j=await r.json(); RDR_CACHE.set(url,j); return j;
                }catch(e){
                    if(e&&e.name==='AbortError') return null;
                    if(i===tries-1){ RDR_STATS.errors++; return null; }
                    await sleep(400*(i+1));
                }
            }
            RDR_STATS.errors++; return null;
        }
        async function radarFetch(url){ return tmdbGet(url,2); }

        /* What the user already has, read straight out of the EXTRA column.

        function parseOwned(extra){

        const tmdbImg=(p,size='w200')=>p?`https://image.tmdb.org/t/p/${size}${p}`:'';

        async function radarCheckItem(row, rows){

                if(!seasons.length) return null;

                    lastEp:lastAir?{n:lastAir.episode_number,s:lastAir.season_number,name:lastAir.name,date:lastAir.air_date}:null,
                    refDate:(nextAir?.air_date)||(lastAir?.air_date)||last.air_date||null };

                  .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
                if(!missing.length) return null;

        async function runRadar(){
            if(!STATE.tmdbKey){ sTst(t('rdrNoKey'),'error'); oMod('stg'); return; }
            if(RDR_SCANNING){ RDR_ABORT?.abort(); return; }
            const items=rdrEligible().filter(r=>extractImdbId(r[COL.IMDB]));
            const rows=[...STATE.data];
            $('rdr-empty')?.classList.add('hidden');
            const c=$('radar-c'); if(c) c.innerHTML='';
            if(!items.length){ RDR_RESULTS=[]; renderRadar(); return; }

            RDR_ABORT=(typeof AbortController!=='undefined')?new AbortController():null;
            RDR_SCANNING=true;
            RDR_STATS={done:0,total:items.length,errors:0,limited:0};
            $('rdr-prog')?.classList.remove('hidden');
            $('rdr-results-bar')?.classList.add('hidden');
            rdrProgress(); lockNav(true); rRdrScanBtn(true);

            const found=[]; let idx=0;
            async function worker(){
                while(idx<items.length){
                    if(RDR_ABORT?.signal?.aborted) return;
                    const r=items[idx++];
                    try{ const res=await radarCheckItem(r, rows); if(res) found.push(res); }
                    catch(e){ RDR_STATS.errors++; }
                    RDR_STATS.done++; rdrProgress();
                }
            }
            try{ await Promise.all(Array.from({length:Math.min(6,items.length)}, worker)); }
            finally{ RDR_SCANNING=false; RDR_ABORT=null; }

            lockNav(false); rRdrScanBtn(false);
            $('rdr-prog')?.classList.add('hidden');
            RDR_RESULTS=rdrSort(found); RDR_SHEET=STATE.sheet;
            renderRadar();

        /* most actionable first: seasons you are missing, then what is airing now, then films */
        const RDR_RANK={'new-season':0,'airing':1,'ended':2,'new-movie':3,'upcoming':4};
        function rdrSort(list){
            return list.slice().sort((a,b)=>{
                const ra=RDR_RANK[a.kind]??9, rb=RDR_RANK[b.kind]??9;
                if(ra!==rb) return ra-rb;
                const ga=parseFloat(String(a.grade).replace(',','.'))||0, gb=parseFloat(String(b.grade).replace(',','.'))||0;
                if(ga!==gb) return gb-ga;
                return String(b.refDate||'').localeCompare(String(a.refDate||''));
            });
        }

            if(RDR_YEAR_ENABLED){
                out=out.map(r=>{
                    if(r.type==='movie'){ const kept=r.newMovies.filter(m=>!m.date||parseInt(m.date.slice(0,4),10)>=RDR_MIN_YEAR); return kept.length?{...r,newMovies:kept}:null; }
                    const y=r.refDate?parseInt(r.refDate.slice(0,4),10):null;
                    return (y==null||y>=RDR_MIN_YEAR)?r:null;
                }).filter(Boolean);
            }
            const q=fold(($('rdr-search')?.value||'').trim());

                .map(([k,lbl,icn])=>`<button type="button" class="pill ${RDR_VIEW===k?'on':'off'}" onclick="setRdrView('${k}')" aria-pressed="${RDR_VIEW===k}">${ic(icn)}<span>${esc(t(lbl))} ${counts[k]}</span></button>`).join('');
        }
        /* ---------- grade range: "8-10", "7+", "7", "6.5-9" ---------- */
        const pfNum = x => parseFloat(String(x).replace(',','.'));
        function parseGradeRange(v){
            const s=String(v||'').trim();
            if(!s) return {min:0,max:10};
            if(/^(any|orice|all|tot|toate)/i.test(s)) return {min:0,max:10};
            let m=s.match(/^(\d{1,2}(?:[.,]\d+)?)\s*[-\u2013\u2014\u2192]\s*(\d{1,2}(?:[.,]\d+)?)$/);
            if(m){ const a=pfNum(m[1]), b=pfNum(m[2]); if(isNaN(a)||isNaN(b))return null; return {min:Math.min(a,b), max:Math.max(a,b)}; }
            m=s.match(/^(\d{1,2}(?:[.,]\d+)?)\s*\+$/);
            if(m){ const a=pfNum(m[1]); return isNaN(a)?null:{min:a,max:10}; }
            m=s.match(/^(\d{1,2}(?:[.,]\d+)?)$/);
            if(m){ const a=pfNum(m[1]); return isNaN(a)?null:{min:a,max:10}; }
            return null;
        }
        const fmtRange = r => (!r||(r.min<=0&&r.max>=10)) ? t('rdrAnyGrade') : (r.max>=10 ? `${r.min}+` : `${r.min}-${r.max}`);

            SRCH_RESULTS=[], SRCH_BUSY=false, SRCH_ADDED=new Set(), GENRE_CACHE={};
        const srchApi = () => SRCH_TYPE==='movie' ? 'movie' : 'tv';
        function setSrchType(v){ SRCH_TYPE=v; ls('srchType',v); SRCH_GENRES=[]; rSrchTypeUI(); loadGenres(); }

            SRCH_BUSY=true; rSrchBtn(true);

            const d=await tmdbGet(tmdbUrl(`discover/${srchApi()}`, params));

            const gmap={}; (GENRE_CACHE[srchApi()]||[]).forEach(g=>gmap[g.id]=g.name);
            SRCH_RESULTS=(d.results||[]).map(x=>({

            }));

        function rSrchBtn(busy){
