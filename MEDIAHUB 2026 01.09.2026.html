    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; --text-color: #ffffff; --card-bg: #141414; --border-color: rgba(255,255,255,0.25);
            --input-bg: #000000; --text-muted: #6b7280; --table-hover: rgba(255,255,255,0.05); --control-bg: rgba(0,0,0,0.3);
            --poster-bg: #080808; --active-tab-bg: rgba(255,255,255,0.05); --active-tab-text: #ffffff;
            --app-font-size: 14px; --t-ha: center; --t-va: middle; --t-wr: normal;
            --theme-accent: #e50914; --active-tab-border: var(--theme-accent);
        }
        
        body.light-theme {
            --bg-color:#f0f2f5; --text-color:#111827; --card-bg:#ffffff; --border-color:rgba(0,0,0,0.25);
            --input-bg:#f3f4f6; --text-muted:#4b5563; --table-hover:rgba(0,0,0,0.02); --control-bg:rgba(0,0,0,0.03);
            --poster-bg:#eaeaea; --active-tab-bg:rgba(0,0,0,0.03); --active-tab-text:#111827;
        }
        
        body { background: var(--bg-color); color: var(--text-color); margin: 0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; transition: all .3s; }
        
        /* CUSTOM UTILITY COMPONENTS */
        .btn { font-weight:900; text-transform:uppercase; transition:all .3s; display:flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; padding:.75rem; font-size:.75rem; cursor:pointer; box-shadow:0 4px 6px -1px rgba(0,0,0,.1); border:none; }
        .btn:disabled, .btn-p:disabled, .btn-s:disabled { opacity:.6; cursor:not-allowed; pointer-events:none; }
        .btn:active, .btn-p:active, .btn-s:active, .btn-i:active { transform:scale(.96); }
        .btn-p { background:var(--theme-accent); color:#fff; } .btn-p:hover { filter:brightness(.85); }
        .btn-s { background:transparent; color:var(--text-color); border:1px solid color-mix(in srgb, var(--theme-accent) 20%, transparent); } .btn-s:hover { background:var(--theme-accent); color:#fff; }
        .btn-i { background:transparent; border:1px solid var(--border-color); color:var(--theme-accent); padding:.5rem; border-radius:.75rem; font-size:.5rem; flex-direction:column; gap:.25rem; } .btn-i:hover { background:rgba(128,128,128,0.1); }
        .inp { background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); width:100%; border-radius:.75rem; padding:.875rem; font-size:.75rem; font-weight:700; outline:none; transition:all .3s; box-sizing:border-box; }
        .inp:focus { box-shadow:0 0 0 2px color-mix(in srgb, var(--theme-accent) 50%, transparent); }
        :focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 2px; }
        .inp:focus-visible { outline: none; }
        .lbl { font-size:.625rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin:0 0 .25rem .25rem; display:block; }
        .h-sub { font-size:.6875rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin-bottom:.75rem; }
        input[type="color"] { -webkit-appearance:none; appearance:none; width:44px; height:44px; padding:0; border:1px solid var(--border-color); border-radius:.75rem; background:var(--input-bg); cursor:pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding:4px; }
        input[type="color"]::-webkit-color-swatch, input[type="color"]::-moz-color-swatch { border:none; border-radius:.5rem; }
        
        /* SPECIFIC APP ELEMENTS */
        .main-wrapper { width:100%; max-width:1280px; margin:0 auto; padding:24px; box-sizing:border-box; overflow-x:hidden; }
        @media (max-width: 768px) { .main-wrapper { padding:12px; } }
        
        .loading-bar { position:sticky; top:0; width:100%; height:5px; background:#111; z-index:1000; display:none; }
        .progress { height:100%; background:var(--theme-accent); transition:width .3s; box-shadow:0 0 10px var(--theme-accent); }
        .theme-card { background:var(--card-bg); border:1px solid var(--border-color); transition:all .3s; }
        .theme-text { color:var(--text-color); }
        .hover-theme:hover { color:var(--text-color); }
        #b-rows { font-size:var(--app-font-size); } 
        .name-cell { font-size:calc(var(--app-font-size) + 6px)!important; font-weight:900; min-width:250px; }
        #nav button { font-size:calc(var(--app-font-size) - 2px); flex-shrink: 0; padding:9.6px 12.8px; }
        @media (min-width:768px) { #nav button { padding:12.8px 19.2px; } }
        #h-row th { font-size:calc(var(--app-font-size) - 3px); padding:8px; }
        .imdb-link { background:#f5c518; color:#000!important; padding:5px 10px; border-radius:4px; font-weight:900; font-size:11px; text-decoration:none; display:inline-flex; align-items:center; letter-spacing:-.5px; transition:transform .1s; } .imdb-link:hover { transform:scale(1.05); filter:brightness(1.1); }
        .poster-container { width:55px; height:80px; position:relative; border:1px solid var(--border-color); border-radius:4px; display:flex; align-items:center; justify-content:center; background:var(--poster-bg); }
        .poster-img { width:100%; height:100%; object-fit:cover; cursor:zoom-in; position:relative; z-index:10; border-radius:4px; }
        #zoom-preview { position:fixed; z-index:9999; pointer-events:none; border-radius:6px; box-shadow:10px 0 30px rgba(0,0,0,.9); outline:2px solid var(--theme-accent); object-fit:cover; display:none; }
        td,th { border:1px solid var(--border-color); text-align:var(--t-ha); vertical-align:var(--t-va); white-space:var(--t-wr); padding:10px; transition:border-color .3s; } tr:hover { background-color:var(--table-hover)!important; }
        .no-cell { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; }
        .no-val { font-weight:900; }
        .no-arrow { background:transparent; border:none; color:var(--theme-accent); cursor:pointer; padding:0; margin:0; width:24px; height:13.2px; font-size:9.6px; line-height:13.2px; opacity:0; transition:opacity .15s ease; }
        tr:hover .no-arrow:not(:disabled) { opacity:.75; }
        .no-arrow:hover:not(:disabled) { opacity:1; }
        .no-arrow:disabled { visibility:hidden; cursor:default; }
        .rw-cell { display:flex; align-items:center; justify-content:center; gap:4px; }
        .rw-val { font-weight:900; min-width:14px; text-align:center; }
        .active-tab { border-bottom:3px solid var(--active-tab-border); color:var(--active-tab-text); background:var(--active-tab-bg); }
        .control-col { min-width:120px; background:var(--control-bg); }
        .grade-cell { max-width:5ch; width:5ch; white-space:nowrap; }
        .grade-next { color:#00ff88!important; font-weight:900; }
        .grade-drop { color:#ff4444!important; font-weight:900; }
        .search-hl { background:color-mix(in srgb, var(--theme-accent) 18%, transparent)!important; border-radius:4px; }
        #s-col-btn { border-left:2px solid transparent; transition:border-color .2s ease, background-color .2s ease; }
        .group:hover #s-col-btn { border-left-color:color-mix(in srgb, var(--theme-accent) 60%, transparent); }
        #s-col-btn:hover, #s-col-btn:focus { background-color:color-mix(in srgb, var(--theme-accent) 12%, transparent); }
        #s-col-btn:focus { box-shadow:0 0 0 0.3px color-mix(in srgb, var(--theme-accent) 10%, transparent) !important; }
        #s-col-btn:focus-visible { outline:1px solid var(--theme-accent); outline-offset:1px; }
        #srch:focus, #srch:focus-visible { outline:none !important; box-shadow:0 0 0 0.3px color-mix(in srgb, var(--theme-accent) 10%, transparent) !important; }
        #srch:-webkit-autofill, #srch:-webkit-autofill:hover, #srch:-webkit-autofill:focus, #srch:-webkit-autofill:active { -webkit-box-shadow:0 0 0 1000px var(--card-bg) inset !important; box-shadow:0 0 0 1000px var(--card-bg) inset !important; -webkit-text-fill-color:var(--text-color) !important; caret-color:var(--text-color); transition:background-color 5000s ease-in-out 0s; }
        .s-col-list { display:none; position:absolute; top:calc(100% + 6px); right:0; min-width:100%; max-height:220px; overflow-y:auto; background:var(--card-bg); border:1px solid var(--border-color); border-radius:.6rem; box-shadow:0 8px 20px rgba(0,0,0,.35); z-index:300; }
        .s-col-list.open { display:block; }
        .s-col-opt { padding:8px 12px; font-size:var(--app-font-size); font-weight:700; text-transform:uppercase; color:var(--text-color); cursor:pointer; white-space:nowrap; }
        .s-col-opt:hover { background:color-mix(in srgb, var(--theme-accent) 15%, transparent); }
        .s-col-opt.active { background:var(--theme-accent); color:#fff; }
        #srch-wrap:hover { box-shadow:0 0 6px color-mix(in srgb, var(--theme-accent) 15%, transparent); }
        #btn-syncall { transition:transform .15s ease, filter .15s ease, box-shadow .15s ease; }
        #btn-syncall:hover { filter:brightness(1.15); transform:scale(1.08); box-shadow:0 0 8px color-mix(in srgb, var(--theme-accent) 60%, transparent); }
        #btn-syncall:active { transform:scale(.95); }

        /* RADAR: new seasons / new movies in a collection */
        .radar-cat { display:inline-flex; align-items:center; gap:4px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 25%, transparent); padding:3px 3px 3px 10px; border-radius:9999px; font-size:9px; font-weight:900; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted); }
        .radar-cat-val { background:var(--theme-accent); color:#fff; padding:2px 8px; border-radius:9999px; font-size:9px; letter-spacing:.03em; }
        .radar-item { display:flex; gap:1rem; align-items:center; padding:.9rem; border:1px solid var(--border-color); border-radius:.8rem; margin-bottom:.6rem; background:var(--input-bg); }
        .radar-poster { width:64px; height:92px; object-fit:cover; border-radius:.5rem; flex-shrink:0; background:var(--poster-bg); }
        .radar-poster-ph { display:flex; align-items:center; justify-content:center; color:var(--text-muted); opacity:.4; font-size:22px; }
        .radar-info { text-align:left; flex:1; min-width:0; }
        .radar-name { font-weight:900; font-size:16px; color:var(--text-color); margin-bottom:.4rem; }
        .radar-badge { display:inline-block; font-size:12px; font-weight:900; letter-spacing:.03em; padding:4px 10px; border-radius:9999px; text-transform:uppercase; }
        .radar-badge.radar-badge-2l { border-radius:12px; line-height:1.5; padding:4px 10px 5px; }
        .radar-badge-line2 { display:block; }
        .radar-badge-airing { background:color-mix(in srgb, #00ff88 20%, transparent); color:#00ff88; }
        .radar-badge-complete { background:var(--theme-accent); color:#fff; }
        .radar-badge-movie { background:color-mix(in srgb, var(--theme-accent) 20%, transparent); color:var(--theme-accent); }
        .radar-sub { font-size:13px; color:var(--text-muted); margin-top:.4rem; }

        /* POSTER/GRADE header: total count + hover tooltip */
        .ph-hdr { position:relative; display:inline-flex; align-items:center; gap:5px; cursor:default; }
        .ph-count { background:var(--theme-accent); color:#fff; font-size:8.5px; font-weight:900; padding:1px 6px; border-radius:9999px; line-height:1.4; }
        .ph-count-dot { width:5px; height:5px; border-radius:50%; background:var(--theme-accent); display:inline-block; }
        .radar-modal-h { min-height:420px; }
        .ph-tip { display:none; position:absolute; top:calc(100% + 8px); left:0; background:var(--input-bg); border:1px solid var(--border-color); border-radius:.6rem; padding:.5rem .25rem; box-shadow:0 8px 20px rgba(0,0,0,.35); z-index:200; }
        body:not(.is-mobile) .ph-hdr:hover .ph-tip { display:block; }
        .ph-hdr.ph-open .ph-tip { display:block; }
        .ph-tip table { border-collapse:collapse; }
        .ph-tip td { padding:2px 10px; font-size:11.4px; font-weight:700; text-transform:none; letter-spacing:normal; text-align:left; white-space:nowrap; color:var(--text-muted); }
        .ph-tip tr td:last-child { text-align:right; font-weight:900; color:var(--theme-accent); }
        #btn-hdr-toggle { transition:transform .15s ease, background-color .15s ease; }
        #btn-hdr-toggle:hover { transform:scale(1.1); background-color:color-mix(in srgb, var(--theme-accent) 15%, transparent); }
        #btn-hdr-toggle:active { transform:scale(.9); }
        #app-header.hdr-hidden { display:none; }
        #tbl-box { max-height:73vh; }
