    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000; --text-color: #ffffff; --card-bg: #141414; --border-color: rgba(255,255,255,0.25);
            --input-bg: #000000; --text-muted: #6b7280; --table-hover: rgba(255,255,255,0.05); --control-bg: rgba(0,0,0,0.3);
            --poster-bg: #080808; --active-tab-bg: rgba(255,255,255,0.05); --active-tab-text: #ffffff;
            --app-font-size: 14px; --t-ha: center; --t-va: middle; --t-wr: normal;
            --theme-accent: #e50914; --active-tab-border: var(--theme-accent);
        }
        
        body.light-theme {
            --bg-color:#f0f2f5; --text-color:#111827; --card-bg:#ffffff; --border-color:rgba(0,0,0,0.25);
            --input-bg:#f3f4f6; --text-muted:#4b5563; --table-hover:rgba(0,0,0,0.02); --control-bg:rgba(0,0,0,0.03);
            --poster-bg:#eaeaea; --active-tab-bg:rgba(0,0,0,0.03); --active-tab-text:#111827;
        }
        
        body { background: var(--bg-color); color: var(--text-color); margin: 0; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; transition: all .3s; }
        
        /* CUSTOM UTILITY COMPONENTS */
        .btn { font-weight:900; text-transform:uppercase; transition:all .3s; display:flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; padding:.75rem; font-size:.75rem; cursor:pointer; box-shadow:0 4px 6px -1px rgba(0,0,0,.1); border:none; }
        .btn:disabled, .btn-p:disabled, .btn-s:disabled { opacity:.6; cursor:not-allowed; pointer-events:none; }
        .btn:active, .btn-p:active, .btn-s:active, .btn-i:active { transform:scale(.96); }
        .btn-p { background:var(--theme-accent); color:#fff; } .btn-p:hover { filter:brightness(.85); }
        .btn-s { background:transparent; color:var(--text-color); border:1px solid color-mix(in srgb, var(--theme-accent) 20%, transparent); } .btn-s:hover { background:var(--theme-accent); color:#fff; }
        .btn-i { background:transparent; border:1px solid var(--border-color); color:var(--theme-accent); padding:.5rem; border-radius:.75rem; font-size:.5rem; flex-direction:column; gap:.25rem; } .btn-i:hover { background:rgba(128,128,128,0.1); }
        .inp { background:var(--input-bg); color:var(--text-color); border:1px solid var(--border-color); width:100%; border-radius:.75rem; padding:.875rem; font-size:.75rem; font-weight:700; outline:none; transition:all .3s; box-sizing:border-box; }
        .inp:focus { box-shadow:0 0 0 2px color-mix(in srgb, var(--theme-accent) 50%, transparent); }
        :focus-visible { outline: 2px solid var(--theme-accent); outline-offset: 2px; }
        .inp:focus-visible { outline: none; }
        .lbl { font-size:.625rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin:0 0 .25rem .25rem; display:block; }
        .h-sub { font-size:.6875rem; font-weight:900; color:var(--text-muted); text-transform:uppercase; margin-bottom:.75rem; }
        input[type="color"] { -webkit-appearance:none; appearance:none; width:44px; height:44px; padding:0; border:1px solid var(--border-color); border-radius:.75rem; background:var(--input-bg); cursor:pointer; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding:4px; }
        input[type="color"]::-webkit-color-swatch, input[type="color"]::-moz-color-swatch { border:none; border-radius:.5rem; }
        
        /* Tailwind is loaded from a CDN; if it is blocked, .hidden stops existing and every
           element the app hides would stay on screen. Define it locally as well. */
        .hidden { display:none !important; }

        /* Safety net: if the icon font fails to load (offline, blocked CDN, ad blocker) an
           icon-only button would collapse to zero size and become unclickable. Reserve the box. */
        i.fas, i.fab { display:inline-block; min-width:1em; min-height:1em; font-style:normal; }

        /* ===== SETTINGS PANEL: pill-shaped controls ===== */
        .set-sec { margin-bottom:1.75rem; }
        .set-hd { display:flex; align-items:center; gap:.5rem; margin-bottom:.25rem; }
        .set-hd i { color:var(--theme-accent); font-size:.8125rem; width:1.125rem; text-align:center; flex-shrink:0; }
        .set-ttl { font-size:.75rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; color:var(--text-color); }
        .set-hint { font-size:.6875rem; font-weight:500; color:var(--text-muted); line-height:1.45; margin:0 0 .75rem 1.625rem; }
        .set-badge { display:inline-flex; align-items:center; gap:.375rem; margin-top:.625rem; padding:.3125rem .75rem; border-radius:999px; font-size:.5625rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; line-height:1.4; background:color-mix(in srgb, var(--theme-accent) 14%, transparent); color:var(--theme-accent); }
        .set-card { padding:1.125rem; border-radius:1.5rem; border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); background:var(--input-bg); }

        /* segmented control (one choice out of N) */
        .seg { display:flex; gap:.25rem; padding:.25rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); }
        .seg-btn { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:.375rem; padding:.625rem .5rem; border:none; border-radius:999px; background:transparent; color:var(--text-muted); font-family:inherit; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; cursor:pointer; transition:background .2s, color .2s, transform .15s, box-shadow .2s; }
        .seg-btn i { font-size:.75rem; flex-shrink:0; }
        .seg-btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .seg-btn:hover { color:var(--text-color); background:color-mix(in srgb, var(--theme-accent) 10%, transparent); }
        .seg-btn.on { background:var(--theme-accent); color:#fff; box-shadow:0 1px 6px color-mix(in srgb, var(--theme-accent) 35%, transparent); }
        .seg-btn.on:hover { background:var(--theme-accent); filter:brightness(1.05); }
        .seg-btn:active { transform:scale(.95); }

        /* switch row (an explicit on/off setting with its own explanation) */
        .sw-row { display:flex; align-items:center; gap:.75rem; width:100%; box-sizing:border-box; padding:.75rem .875rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); cursor:pointer; font-family:inherit; color:var(--text-color); text-align:left; transition:border-color .2s, background .2s, transform .15s; }
        .sw-row + .sw-row { margin-top:.5rem; }
        .sw-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 50%, transparent); background:color-mix(in srgb, var(--theme-accent) 6%, var(--input-bg)); }
        .sw-row:active { transform:scale(.99); }
        .sw-ico { flex:0 0 auto; width:1.875rem; height:1.875rem; border-radius:999px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--theme-accent) 12%, transparent); color:var(--theme-accent); font-size:.75rem; transition:background .2s; }
        .sw-row.on .sw-ico { background:color-mix(in srgb, var(--theme-accent) 22%, transparent); }
        .sw-txt { flex:1 1 auto; min-width:0; }
        .sw-name { display:block; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; line-height:1.3; }
        .sw-sub { display:block; font-size:.625rem; font-weight:500; color:var(--text-muted); line-height:1.35; margin-top:.0625rem; }
        .sw-state { flex:0 0 auto; min-width:2.25rem; text-align:right; font-size:.5625rem; font-weight:900; text-transform:uppercase; color:var(--text-muted); letter-spacing:.02em; }
        .sw-row.on .sw-state { color:var(--theme-accent); }
        .sw-tgl { flex:0 0 auto; width:2.375rem; height:1.375rem; border-radius:999px; background:color-mix(in srgb, var(--text-muted) 50%, transparent); position:relative; transition:background .25s; }
        .sw-tgl::after { content:''; position:absolute; top:.125rem; left:.125rem; width:1.125rem; height:1.125rem; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.45); transition:transform .25s; }
        .sw-row.on .sw-tgl { background:var(--theme-accent); }
        .sw-row.on .sw-tgl::after { transform:translateX(1rem); }

        /* toggle pills (visible categories / visible columns) */
        .pill-wrap { display:flex; flex-wrap:wrap; gap:.4375rem; }
        .pill { display:inline-flex; align-items:center; gap:.375rem; padding:.4375rem .8125rem; border-radius:999px; font-family:inherit; font-size:.625rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; cursor:pointer; border:1px solid transparent; transition:background .2s, color .2s, border-color .2s, transform .15s; }
        .pill i { font-size:.5625rem; opacity:.9; }
        .pill.on { background:var(--theme-accent); color:#fff; border-color:var(--theme-accent); }
        .pill.on:hover { filter:brightness(1.08); }
        .pill.off { background:transparent; color:var(--text-muted); border-color:color-mix(in srgb, var(--theme-accent) 22%, transparent); }
        .pill.off:hover { color:var(--text-color); border-color:color-mix(in srgb, var(--theme-accent) 55%, transparent); }
        .pill:active { transform:scale(.94); }

        /* action row: same pill shape as a switch, but it performs something */
        .act-row { display:flex; align-items:center; gap:.75rem; width:100%; box-sizing:border-box; padding:.75rem .875rem; border-radius:999px; background:var(--input-bg); border:1px solid color-mix(in srgb, var(--theme-accent) 18%, transparent); cursor:pointer; font-family:inherit; color:var(--text-color); text-align:left; transition:border-color .2s, background .2s, transform .15s; }
        .act-row + .act-row { margin-top:.5rem; }
        .act-row:hover { border-color:color-mix(in srgb, var(--theme-accent) 50%, transparent); background:color-mix(in srgb, var(--theme-accent) 6%, var(--input-bg)); }
        .act-row:active { transform:scale(.99); }
        .act-go { flex:0 0 auto; width:1.75rem; height:1.75rem; border-radius:999px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--theme-accent) 12%, transparent); color:var(--theme-accent); font-size:.625rem; transition:background .2s, color .2s, transform .2s; }
        .act-row:hover .act-go { background:var(--theme-accent); color:#fff; transform:translateX(2px); }

        /* storage usage meter */
        .meter { height:.4375rem; border-radius:999px; background:color-mix(in srgb, var(--text-muted) 28%, transparent); overflow:hidden; }
        .meter-fill { display:block; height:100%; border-radius:999px; background:var(--theme-accent); transition:width .45s ease; }
        .meter-fill.warn { background:#f0a020; }
        .meter-fill.full { background:#e0342c; }
        .meter-cap { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; margin-bottom:.4375rem; font-size:.625rem; font-weight:900; text-transform:uppercase; letter-spacing:.01em; }
        .meter-cap b { color:var(--theme-accent); font-weight:900; }
        .meter-note { font-size:.625rem; font-weight:500; color:var(--text-muted); line-height:1.4; margin-top:.4375rem; }

        /* danger card */
        .set-card.danger { border-color:color-mix(in srgb, var(--theme-accent) 38%, transparent); background:color-mix(in srgb, var(--theme-accent) 8%, transparent); }
        .btn-danger { display:flex; align-items:center; justify-content:center; gap:.5rem; width:100%; box-sizing:border-box; padding:.75rem; border-radius:999px; font-family:inherit; font-size:.6875rem; font-weight:900; text-transform:uppercase; letter-spacing:.02em; cursor:pointer; background:transparent; color:var(--theme-accent); border:1px solid color-mix(in srgb, var(--theme-accent) 45%, transparent); transition:background .2s, color .2s, transform .15s; }
        .btn-danger:hover { background:var(--theme-accent); color:#fff; border-color:var(--theme-accent); }
        .btn-danger:active { transform:scale(.97); }

        .inp-pill { border-radius:999px; text-align:center; }
        .btn-pill { border-radius:999px; padding:.9375rem; font-size:.8125rem; font-weight:900; text-transform:uppercase; letter-spacing:.04em; }
        @media (max-width:420px) {
            .seg-btn { font-size:.625rem; padding:.5625rem .375rem; }
            .sw-sub { display:none; }
        }

        /* SPECIFIC APP ELEMENTS */
        .main-wrapper { width:100%; max-width:1280px; margin:0 auto; padding:24px; box-sizing:border-box; overflow-x:hidden; }
        @media (max-width: 768px) { .main-wrapper { padding:12px; } }
        
        .loading-bar { position:sticky; top:0; width:100%; height:5px; background:#111; z-index:1000; display:none; }

        /* ============================ RADAR ============================
           Scans the current category against TMDB and reports what changed since you
           last watched. Compared with the old version it:
             - reads how many seasons/episodes YOU have from the EXTRA column and reports
               the gap, instead of only describing TMDB's latest season
             - no longer requires "Returning Series", so a finished show that dropped a
               final season you never added is still reported
             - spends 2 requests per title instead of 3 (aired counts come from
               last_episode_to_air rather than a full season fetch)
             - caches every response, retries on HTTP 429 and surfaces real errors
             - can expand a card to pull the full episode list on demand
        */
        function extractImdbId(v){ const m=String(v||'').match(/tt\d{6,9}/); return m?m[0]:null; }

        const RDR_CACHE=new Map();
        let RDR_ABORT=null, RDR_SCANNING=false, RDR_STATS={done:0,total:0,errors:0,limited:0};
        const sleep=ms=>new Promise(r=>setTimeout(r,ms));

        /* Cached GET with backoff. TMDB answers 429 with a Retry-After header when you go
           over its rate limit; the old code treated that as "nothing new" and moved on. */
        async function tmdbGet(url, tries=3){
            if(RDR_CACHE.has(url)) return RDR_CACHE.get(url);
            for(let i=0;i<tries;i++){
                if(RDR_ABORT?.signal?.aborted) return null;
                try{
                    const r=await fetch(url, RDR_ABORT?{signal:RDR_ABORT.signal}:undefined);
                    if(r.status===429){
                        RDR_STATS.limited++;
                        const wait=(parseInt(r.headers.get('retry-after'),10)||1)*1000;
                        await sleep(Math.min(wait, 8000)); continue;
                    }
                    if(r.status===404){ RDR_CACHE.set(url,null); return null; }
                    if(!r.ok){ RDR_STATS.errors++; RDR_CACHE.set(url,null); return null; }
                    const j=await r.json(); RDR_CACHE.set(url,j); return j;
                }catch(e){
                    if(e&&e.name==='AbortError') return null;
                    if(i===tries-1){ RDR_STATS.errors++; return null; }
                    await sleep(400*(i+1));
                }
            }
            RDR_STATS.errors++; return null;
        }
        async function radarFetch(url){ return tmdbGet(url,2); }

        /* What the user already has, read straight out of the EXTRA column.
           Handles "3 Seasons | 26 Episodes", "R+ 4-Seasons 89 EP", "112 min", "N/A". */

            const mn=s.match(/(\d+)\s*min/i);
            return { seasons:se?parseInt(se[1],10):null, episodes:ep?parseInt(ep[1],10):null, runtime:mn?parseInt(mn[1],10):null };
        }
        const todayISO=()=>new Date().toISOString().slice(0,10);

        function fmtRadarDate(d){ if(!d)return ''; const dt=new Date(d+'T00:00:00'); if(isNaN(dt))return ''; const loc=STATE.lang==='RO'?'ro-RO':'en-US'; return `${dt.getDate()} ${dt.toLocaleString(loc,{month:'short'}).toUpperCase().replace('.','')} ${dt.getFullYear()}`; }
        const tmdbImg=(p,size='w200')=>p?`https://image.tmdb.org/t/p/${size}${p}`:'';

        async function radarCheckItem(row, rows){
            rows=rows||STATE.data;

            const base={ name:row[COL.NAME], grade:row[COL.GRADE], poster:row[COL.POSTER], imdbId,
                         owned:parseOwned(COL.EXTRA!==undefined?row[COL.EXTRA]:'') };

            if(find.tv_results?.length){
                const id=find.tv_results[0].id;
                const tv=await tmdbGet(tmdbUrl(`tv/${id}`,{language:lng}));
                if(!tv) return null;
                const seasons=(tv.seasons||[]).filter(s=>s.season_number>0 && (s.episode_count||0)>0);
                if(!seasons.length) return null;
                const last=seasons[seasons.length-1];
                const totalSeasons=seasons.length;
                const ownedSeasons=base.owned.seasons;
                const totalEpisodes=seasons.reduce((a,s)=>a+(s.episode_count||0),0);

                const lastAir=tv.last_episode_to_air, nextAir=tv.next_episode_to_air;
                const total=last.episode_count||0;
                let aired=0;
                if(lastAir && lastAir.season_number===last.season_number) aired=lastAir.episode_number||0;
                else if(last.air_date && last.air_date<=todayISO() && !nextAir) aired=total;
                const complete=total>0 && aired>=total && !nextAir;

                /* Ranked by how much it actually asks of the user */
                let kind='caught-up';
                if(ownedSeasons!=null && totalSeasons>ownedSeasons) kind='new-season';
                else if(nextAir) kind='airing';
                else if(ownedSeasons==null && totalSeasons>1) kind='airing';
                if(kind==='airing' && !nextAir && complete && /Ended|Canceled/i.test(tv.status||'')) kind='ended';
                if(kind==='caught-up') return null;

                return { ...base, type:'tv', tmdbId:id, tmdbTitle:tv.name,
                    tmdbPoster:tmdbImg(tv.poster_path), backdrop:tmdbImg(tv.backdrop_path,'w780'),
                    kind, statusRaw:tv.status||'', inProduction:!!tv.in_production,
                    seasonNum:last.season_number, seasonName:last.name, aired, total, complete,
                    seasonsOwned:ownedSeasons, seasonsTotal:totalSeasons,
                    episodesOwned:base.owned.episodes, episodesTotal:totalEpisodes,
                    network:(tv.networks||[])[0]?.name||'', vote:tv.vote_average||0,
                    overview:tv.overview||'', firstAir:tv.first_air_date||'',
                    nextEp:nextAir?{n:nextAir.episode_number,s:nextAir.season_number,name:nextAir.name,date:nextAir.air_date}:null,
                    lastEp:lastAir?{n:lastAir.episode_number,s:lastAir.season_number,name:lastAir.name,date:lastAir.air_date}:null,
                    refDate:(nextAir?.air_date)||(lastAir?.air_date)||last.air_date||null };
            }

            if(find.movie_results?.length){
                const id=find.movie_results[0].id;
                const movie=await tmdbGet(tmdbUrl(`movie/${id}`,{language:lng}));
                if(!movie?.belongs_to_collection) return null;
                const coll=await tmdbGet(tmdbUrl(`collection/${movie.belongs_to_collection.id}`,{language:lng}));

                const missing=coll.parts.filter(p=>{
                    const a=normTitle(p.title), b=normTitle(p.original_title);
                    return !(a&&have.has(a)) && !(b&&have.has(b));
                }).map(p=>({ title:p.title, date:p.release_date||'', vote:p.vote_average||0,
                             poster:tmdbImg(p.poster_path,'w92'), overview:p.overview||'',
                             upcoming:!p.release_date || p.release_date>todayISO() }))
                  .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
                if(!missing.length) return null;
                const released=missing.filter(m=>!m.upcoming);
                return { ...base, type:'movie', tmdbId:id, tmdbTitle:movie.title,
                    tmdbPoster:tmdbImg(movie.poster_path), backdrop:tmdbImg(movie.backdrop_path,'w780'),
                    kind:released.length?'new-movie':'upcoming',
                    collection:movie.belongs_to_collection.name||'', overview:movie.overview||'',
                    vote:movie.vote_average||0, newMovies:missing,
                    refDate:(released[released.length-1]||missing[0]).date||null };

        async function runRadar(){
            if(!STATE.tmdbKey){ sTst(t('rdrNoKey'),'error'); oMod('stg'); return; }
            if(RDR_SCANNING){ RDR_ABORT?.abort(); return; }
            const items=rdrEligible().filter(r=>extractImdbId(r[COL.IMDB]));
            const rows=[...STATE.data];

            $('rdr-prog')?.classList.remove('hidden');
            $('rdr-results-bar')?.classList.add('hidden');
            rdrProgress(); lockNav(true); rRdrScanBtn(true);

            const found=[]; let idx=0;
            async function worker(){
                while(idx<items.length){
                    if(RDR_ABORT?.signal?.aborted) return;
                    const r=items[idx++];
                    try{ const res=await radarCheckItem(r, rows); if(res) found.push(res); }
                    catch(e){ RDR_STATS.errors++; }
                    RDR_STATS.done++; rdrProgress();
                }
            }
            try{ await Promise.all(Array.from({length:Math.min(6,items.length)}, worker)); }
            finally{ RDR_SCANNING=false; RDR_ABORT=null; }

            lockNav(false); rRdrScanBtn(false);
            $('rdr-prog')?.classList.add('hidden');
            RDR_RESULTS=rdrSort(found); RDR_SHEET=STATE.sheet;

        async function sCld(){
            if(!STATE.url) return sTst(t("mNC"),"error"), oMod('stg');
            const b=$('btn-sv'); if(b.disabled)return;
            setLd(true); b.disabled=true; b.innerHTML=ic('spinner','fa-spin'); lockNav(true);
            const savedSheet=STATE.sheet;
            try{
                const p={action:'write',pass:STATE.pass,sheet:savedSheet,values:[STATE.hdrs,...STATE.data],config:{
                    FONT_SIZE:STATE.dPc.fs,H_ALIGN:STATE.dPc.ha,V_ALIGN:STATE.dPc.va,T_WRAP:STATE.dPc.wr,HIDDEN_COLS:JSON.stringify(STATE.dPc.hC),
                    FONT_SIZE_MOBILE:STATE.dMb.fs,H_ALIGN_MOBILE:STATE.dMb.ha,V_ALIGN_MOBILE:STATE.dMb.va,T_WRAP_MOBILE:STATE.dMb.wr,HIDDEN_COLS_MOBILE:JSON.stringify(STATE.dMb.hC),
                    COLOR_RULES:STATE.cR,COLOR_FORMATTING:STATE.cF,HIDDEN_TABS:JSON.stringify(STATE.hT),LANG:STATE.lang,THEME:STATE.theme,ALL_TABS:JSON.stringify(STATE.aT),VIEW_MODE:STATE.vM,TRACK:STATE.track,REDUCE_MOTION:STATE.reduceMotion
                }};
                await fetch(STATE.url,{method:'POST',mode:'no-cors',body:JSON.stringify(p)});
                /* no-cors resolves as soon as the request leaves the browser, not when Apps Script
                   has finished writing - so poll a few times before judging the result. */
                let vd=null, match=false, reached=false;
                for(let attempt=0; attempt<3 && !match; attempt++){
                    await new Promise(r=>setTimeout(r, attempt===0?800:1400));
                    vd=await chkCloud(STATE.url, STATE.pass, savedSheet);
                    if(vd&&vd.ok&&Array.isArray(vd.values)){ reached=true; match=cloudMatches(vd.values, p.values); }
                }
                if(match){ sTst(t("mSv")); setUns(false); STATE.lastSaved=Date.now(); ls('lastSaved',STATE.lastSaved); vibSv(); }
                else if(reached){ sTst(t("mSvChk"),"warning"); STATE.lastSaved=Date.now(); ls('lastSaved',STATE.lastSaved); }
                else { sTst((vd&&vd.error)||t("mF"),"error"); }
            }catch(e){sTst(t("mF"),"error");}
            /* rebuild the full button, #last-saved included - the old version dropped that span
               for good, so the "saved N min ago" label vanished after the first save */
            b.disabled=false; b.innerHTML=`${ic('cloud-arrow-up')} <span id="last-saved" class="font-bold uppercase tracking-wide" style="white-space:nowrap;"></span> <span id="uns-dot" class="absolute top-0 right-0 rounded-full bg-white shadow-md border-2 border-black" style="display:${STATE.uns?'flex':'none'};"></span>`;
            rLastSaved(); setLd(false); lockNav(false);
            if(SAV_TAB){ const nx=SAV_TAB; SAV_TAB=null; sTab(nx); }
        }
        function rLastSaved(){
            const el=$('last-saved'); if(!el)return;
            if(!STATE.lastSaved){ el.textContent=''; return; }
            const mins=Math.floor((Date.now()-STATE.lastSaved)/60000);
            if(mins<1) el.textContent=t('svN');
            else if(mins<60) el.textContent=t('svA').replace('{m}', mins);
            else if(mins<1440) el.textContent=t('svH').replace('{n}', Math.floor(mins/60));
            else el.textContent=t('svD').replace('{n}', Math.floor(mins/1440));
        }
        
        function uVal(r,c,v){
            const row=STATE.data[r]; if(!row||isNaN(c)||c<0) return;
            const raw=String(v??'');
            const n=c===COL.GRADE?raw.trim().toUpperCase().replace(/,/g,'.'):raw.trim();
            if(row[c]===n)return;
            STATE.hist.push({t:'E',rowRef:row,c,v:row[c]});
            row[c]=n;
            setUns(true);
            if(c===COL.GRADE){
                /* a new grade changes the ranking, so the whole table has to be rebuilt */
                STATE.hlRef=row;
                cmtSt(null,true);
                return;
            }
            upLib(STATE.sheet, STATE.hdrs, STATE.data);
            if(updateRow(r)) rHdr(); else rTab();
        }
        
        function eLnk(r,c){ if(!STATE.data[r])return; oMod('lnk'); const cur=STATE.data[r][c]; $('i-lk').value=cur; setTimeout(()=>$('i-lk').focus(),50); $('b-lk-sv').onclick=()=>{ const n=$('i-lk').value.trim(); cMod(); if(n!==cur){STATE.hist.push({t:'E',rowRef:STATE.data[r],c,v:cur}); STATE.data[r][c]=n; cmtSt(); setUns(true);} }; }
        function dRow(i){ if(!STATE.data[i])return; cfmM(t('dC'), ()=>{ if(!STATE.data[i])return;STATE.hist.push({t:'D',r:i,row:[...STATE.data[i]]}); STATE.data.splice(i,1); cmtSt(t("mDl")); setUns(true);}); }

        function mvRow(oi, dir){
            const idx=STATE.fDat.findIndex(x=>x.origIdx===oi); if(idx<0)return;
            const tIdx=idx+dir; if(tIdx<0||tIdx>=STATE.fDat.length)return;
            const a=STATE.fDat[idx].origIdx, b=STATE.fDat[tIdx].origIdx;
            [STATE.data[a],STATE.data[b]]=[STATE.data[b],STATE.data[a]];
            cmtSt(null,'num'); setUns(true);
        }
        function chgRw(r,c,delta){
            if(!STATE.data[r]) return;
            const cur=String(STATE.data[r][c]??'').trim()===''?0:(parseInt(STATE.data[r][c],10)||0);
            uVal(r,c,String(Math.max(0,cur+delta)));
        }
        function tHdr(){
            const hdr=$('app-header'), btn=$('btn-sv'), slot=$('btn-sv-slot'), radar=$('hdr-radar'), gear=$('hdr-gear'), left=$('hdr-left'), extra=$('nav-extra');
            if(!hdr||!btn||!slot||!extra)return;
            const hidden=hdr.classList.toggle('hdr-hidden');
            if(hidden){ if(radar) extra.appendChild(radar); if(gear) extra.appendChild(gear); extra.appendChild(btn); }
            else { if(gear && left) left.appendChild(gear); if(radar && left) left.appendChild(radar); slot.appendChild(btn); }
            const b=$('btn-hdr-toggle'); if(b) b.innerHTML=ic(hidden?'eye':'eye-slash');
            fitTbl();
        }
        function fitTbl(){
            const tb=$('tbl-box'); if(!tb)return;
            if($('app-header')?.classList.contains('hdr-hidden')){
                const top=tb.getBoundingClientRect().top;
                tb.style.maxHeight=Math.max(200, window.innerHeight-top-24)+'px';
            } else {
                tb.style.maxHeight='';
            }
        }
        function focusCell(rowRef, colIdx){
            const entry=STATE.fDat.find(x=>x.row===rowRef); if(!entry)return;
            const tr=DOM.br.querySelector(`tr[data-oi="${entry.origIdx}"]`); if(!tr)return;
            const cell=tr.querySelector(`[data-c="${colIdx}"][contenteditable="true"]`); if(!cell)return;
            cell.focus(); const r=document.createRange(); r.selectNodeContents(cell); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
        }

        const zp=$('zoom-preview');
        let zoomPinned=null;
        function showZoom(img){
            const r=img.getBoundingClientRect();
            let w=r.width*3, h=r.height*3;
            /* scale down so a 3x poster can never overflow a narrow screen */
            const fit=Math.min(1,(window.innerWidth-16)/w,(window.innerHeight-16)/h);
            w=Math.round(w*fit); h=Math.round(h*fit);
            let left=r.right+8, top=r.top+r.height/2-h/2;
            if(left+w>window.innerWidth) left=r.left-8-w;
            left=Math.max(8,Math.min(left,window.innerWidth-w-8));
            top=Math.max(8,Math.min(top,window.innerHeight-h-8));
            zp.src=img.src; zp.style.width=w+'px'; zp.style.height=h+'px'; zp.style.left=left+'px'; zp.style.top=top+'px'; zp.style.display='block';
        }
        function hideZoom(){ zp.style.display='none'; zoomPinned=null; }
        
        function uAct(){ 
            if(STATE.hist.length===0)return; 
            const a=STATE.hist.pop(); 
            if(a.t==='E') { a.rowRef[a.c]=a.v; STATE.hlRef = a.rowRef; }
            else if(a.t==='D') { STATE.data.splice(a.r,0,a.row); STATE.hlRef = a.row; }
            cmtSt(a.t==='E'?t("mRv"):t("mRs"),true); 
        }
        
        /* ---- popup menu shared by the row and the table header ---- */
        let MENU_EL=null;
        function closeMenu(){ if(MENU_EL){ MENU_EL.remove(); MENU_EL=null; } }
        function openMenu(anchor, items){
            closeMenu();
            const m=document.createElement('div'); m.className='pop-menu'; m.setAttribute('role','menu');
            m.innerHTML=items.map((it,i)=> it==='-' ? '<div class="pop-sep"></div>'
                : `<button type="button" role="menuitem" class="pop-item${it.danger?' danger':''}" data-mi="${i}"${it.disabled?' disabled':''}>${ic(it.icon)}<span>${esc(it.label)}</span></button>`).join('');
            document.body.appendChild(m);
            const r=anchor.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
            let left=r.right-mw, top=r.bottom+6;
            if(top+mh>window.innerHeight-8) top=Math.max(8, r.top-mh-6);
            m.style.left=Math.max(8, Math.min(left, window.innerWidth-mw-8))+'px';
            m.style.top=top+'px';
            m.addEventListener('click', e=>{ const b=e.target.closest('[data-mi]'); if(!b||b.disabled)return; const it=items[+b.dataset.mi]; closeMenu(); it.run&&it.run(); });
            MENU_EL=m;
        }
        /* Row menu: row-scoped actions only. Table-wide actions live in the header menu. */
        function rowMenu(r, btn){
            const row=STATE.data[r]; if(!row) return;
            const at=()=>STATE.data.indexOf(row);
            openMenu(btn, [
                {icon:'wand-magic-sparkles', label:t('mnuSyncRow'), run:()=>{ const i=at(); if(i>=0) syR(i,false,true); }},
                {icon:'trash-can', label:t('del'), danger:true, run:()=>{ const i=at(); if(i>=0) dRow(i); }}
            ]);
        }
        function tblMenu(btn){
            const hdrHid=$('app-header')?.classList.contains('hdr-hidden');
            openMenu(btn, [
                {icon:'rotate', label:t('mnuSyncTbl'), run:()=>bSy()},
                {icon:'arrow-rotate-left', label:`${t('un')} (${STATE.hist.length})`, disabled:STATE.hist.length===0, run:()=>uAct()},
                '-',
                {icon:hdrHid?'eye':'eye-slash', label:t(hdrHid?'mnuShowHdr':'mnuHideHdr'), run:()=>tHdr()}
            ]);
        }
        /* Pills are a display layer; clicking the cell swaps in the raw text so it stays editable. */
        function editPillCell(r,c){
            const tr=DOM.br.querySelector(`tr[data-oi="${r}"]`); if(!tr) return;
            const cell=tr.querySelector(`.cell-pills[data-c="${c}"]`); if(!cell) return;
            const raw=String(STATE.data[r]?.[c] ?? '');
            cell.classList.remove('is-empty');
            cell.innerHTML='';
            const ed=document.createElement('div');
            ed.className='pill-edit'; ed.setAttribute('contenteditable','true');
            ed.dataset.a='e'; ed.dataset.r=r; ed.dataset.c=c; ed.textContent=raw;
            cell.appendChild(ed); ed.focus();
            const rg=document.createRange(); rg.selectNodeContents(ed);
            const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
        }
        let LAST_ACT=0;
        function runRowAct(b){
            const a=b.dataset.a, c=parseInt(b.dataset.c);
            let r=parseInt(b.dataset.r);
            const rowRef=STATE.data[r];
            const act=document.activeElement;
            if(act && act.closest && act.closest('[data-a="e"]')) act.blur();
            if(rowRef){ const nr=STATE.data.indexOf(rowRef); if(nr<0)return; r=nr; }
            if(a==='d')dRow(r); else if(a==='s')syR(r,false,true); else if(a==='l')eLnk(r,c); else if(a==='n')oNt(r,c);
            else if(a==='mu')mvRow(r,-1); else if(a==='md')mvRow(r,1); else if(a==='rwi')chgRw(r,c,1); else if(a==='rwd')chgRw(r,c,-1);
            else if(a==='pe')editPillCell(r,c); else if(a==='mnu')rowMenu(r,b);
        }
        function setLd(s){ DOM.ld.style.display=s?'block':'none'; }
        
        window.onload=()=>{
            DOM={ ld:$('ldr'), brs:$('bar'), ts:$('tst-container'), nv:$('nav'), sr:$('srch'), hr:$('h-row'), br:$('b-rows'), md:$('m-mod'), mb:$('m-box') };
            document.addEventListener('keydown', onKeydown);

            /* Pointerdown, not click: the old click handler was swallowed whenever the previous
               focusout re-rendered the table between mousedown and mouseup. The pending edit is
               committed first, then the row index is re-resolved from the row object (it may have
               moved if that edit changed the grade). */
            const SKIP_ACT=new Set(['e','ix','pm']);
            DOM.br.addEventListener('pointerdown',e=>{ const b=e.target.closest('[data-a]'); if(!b||SKIP_ACT.has(b.dataset.a)||b.disabled)return; if(b.dataset.a==='pe') e.preventDefault(); LAST_ACT=Date.now(); runRowAct(b); });
            DOM.br.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(!b||SKIP_ACT.has(b.dataset.a)||b.disabled)return; if(Date.now()-LAST_ACT<800)return; runRowAct(b); });
            document.addEventListener('pointerdown',e=>{ if(MENU_EL && !e.target.closest('.pop-menu') && !e.target.closest('[data-a="mnu"]') && !e.target.closest('.menu-btn')) closeMenu(); });
            window.addEventListener('scroll', closeMenu, true);
            window.addEventListener('resize', closeMenu);

            DOM.br.addEventListener('mouseover',e=>{
                const img=e.target.closest('.poster-img'); if(!img||!img.getAttribute('src'))return;
                showZoom(img);
            });
            DOM.br.addEventListener('mouseout',e=>{ if(e.target.closest('.poster-img')) hideZoom(); });
            DOM.br.addEventListener('click',e=>{
                const img=e.target.closest('.poster-img'); if(!img||!img.getAttribute('src'))return;
                if(zoomPinned===img) hideZoom(); else { showZoom(img); zoomPinned=img; }
            });
            document.addEventListener('click',e=>{ if(zoomPinned && !e.target.closest('.poster-img')) hideZoom(); });
            document.addEventListener('click',e=>{ if(!e.target.closest('.ph-hdr')) document.querySelectorAll('.ph-hdr.ph-open').forEach(x=>x.classList.remove('ph-open')); });
            document.addEventListener('click',e=>{ if(!e.target.closest('#s-col-wrap')){ const list=$('s-col-list'), btn=$('s-col-btn'); if(list)list.classList.remove('open'); if(btn)btn.setAttribute('aria-expanded','false'); } });
            document.addEventListener('click',e=>{ if(!e.target.closest('#rdr-grade-wrap')){ const list=$('rdr-grade-list'), btn=$('rdr-grade-btn'); if(list)list.classList.remove('open'); if(btn)btn.setAttribute('aria-expanded','false'); } });

            DOM.nv.addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) sTab(b.dataset.tab); });
            DOM.md.addEventListener('click',e=>{
                const tb=e.target.closest('[data-tmp-t]'); if(tb){ tTmp('t', tb.dataset.tmpT); return; }
                const cb=e.target.closest('[data-tmp-c]'); if(cb){ tTmp('c', cb.dataset.tmpC); return; }
            });
            
            DOM.br.addEventListener('focusout',e=>{
                const d=e.target.closest('[data-a="e"]'); 
                if(d){
                    const r=parseInt(d.dataset.r), c=parseInt(d.dataset.c);
                    const wasPill=d.classList.contains('pill-edit');
                    uVal(r,c,d.innerText??d.textContent);
                    if(wasPill) updateRow(r);
                }
            });
            
            DOM.br.addEventListener('keydown',e=>{const c=e.target.closest('[contenteditable="true"]'); if(!c)return; const s=window.getSelection(); if(e.shiftKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault(); const tr=c.closest('tr'), oi=parseInt(tr.dataset.oi), colIdx=c.dataset.c, rowRef=STATE.data[oi]; c.blur(); mvRow(oi, e.key==='ArrowUp'?-1:1); focusCell(rowRef, colIdx); return;} if(['ArrowUp','ArrowDown','Enter'].includes(e.key)){e.preventDefault(); const tT=(e.key==='ArrowUp')?c.closest('tr').previousElementSibling:c.closest('tr').nextElementSibling; if(tT){const nC=tT.querySelector(`[data-c="${c.dataset.c}"][contenteditable="true"]`); if(nC){nC.focus(); const r=document.createRange(); r.selectNodeContents(nC); s.removeAllRanges(); s.addRange(r);}}} if(['ArrowLeft','ArrowRight'].includes(e.key)){const aS=s.focusOffset===0, l=s.focusNode?s.focusNode.textContent.length:0, aE=s.focusOffset===l; if((e.key==='ArrowLeft'&&aS)||(e.key==='ArrowRight'&&aE)){e.preventDefault(); const es=Array.from(c.closest('tr').querySelectorAll('[contenteditable="true"]')), i=es.indexOf(c); let tg=null; if(e.key==='ArrowLeft'&&i>0)tg=es[i-1]; if(e.key==='ArrowRight'&&i<es.length-1)tg=es[i+1]; if(tg){tg.focus(); const r=document.createRange(); r.selectNodeContents(tg); s.removeAllRanges(); s.addRange(r);}}}});
            DOM.br.addEventListener('paste',e=>{
                const el=e.target.closest('[contenteditable="true"]'); if(!el)return;
                e.preventDefault();
                const tx=(e.clipboardData||window.clipboardData).getData('text/plain').trim().replace(/[\r\n]+/g,'');
                const sel=window.getSelection(); if(!sel.rangeCount)return;
                const range=sel.getRangeAt(0); range.deleteContents();
                const node=document.createTextNode(tx); range.insertNode(node);
                range.setStartAfter(node); range.setEndAfter(node);
                sel.removeAllRanges(); sel.addRange(range);
            });
            document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) rLastSaved(); });
            pCRul(); aThUI(); aVM(); aRM(); applyDisp(false); rTbs(); lDat(); rLastSaved(); setInterval(rLastSaved, 15000);
        };
    </script>
